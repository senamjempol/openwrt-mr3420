```yaml
name: Build OpenWrt 21.02 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Clone OpenWrt 21.02
        run: |
          git clone --branch openwrt-21.02 \
            --single-branch \
            https://github.com/openwrt/openwrt.git openwrt

          cd openwrt

          echo "OpenWrt source:"
          git describe --tags --always

      - name: Patch MR3420 v3
        run: |
          cd openwrt

          TINY="target/linux/ath79/image/tiny-tp-link.mk"
          GENERIC="target/linux/ath79/image/generic-tp-link.mk"

          echo "=== ORIGINAL MR3420 ==="

          grep -n -A12 -B2 \
            "tplink_tl-mr3420-v3" \
            "$TINY" || true

          echo ""
          echo "=== REMOVE MR3420 FROM TINY ==="

          sed -i \
            '/define Device\/tplink_tl-mr3420-v3/,/endef/d' \
            "$TINY"

          sed -i \
            '/TARGET_DEVICES += tplink_tl-mr3420-v3/d' \
            "$TINY"

          echo ""
          echo "=== ADD MR3420 TO GENERIC ==="

          cat >> "$GENERIC" <<'EOF'

          # TP-Link TL-MR3420 v3 - 8MB

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF

          echo ""
          echo "=== GENERIC MR3420 ==="

          grep -n -A12 -B2 \
            "tplink_tl-mr3420-v3" \
            "$GENERIC"

      - name: Check 8MB Layout
        run: |
          cd openwrt

          echo "=== 8MLZMA ==="

          grep -n -A8 -B2 \
            "define Device/tplink-8mlzma" \
            target/linux/ath79/image/common-tp-link.mk

          echo ""
          echo "=== CHECK FLASH LAYOUT ==="

          grep -n \
            "TPLINK_FLASHLAYOUT := 8Mlzma" \
            target/linux/ath79/image/common-tp-link.mk

      - name: Update Feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y

          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_id=y
          EOF

          make defconfig

      - name: Verify Configuration
        run: |
          cd openwrt

          echo "================================"
          echo "TARGET"
          echo "================================"

          grep "^CONFIG_TARGET_" .config

          echo ""
          echo "================================"
          echo "MR3420 SOURCE"
          echo "================================"

          grep -R -n \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image

          echo ""
          echo "================================"
          echo "CARAMBOLA CHECK"
          echo "================================"

          if grep -qi "carambola2" .config; then
            echo "ERROR: CARAMBOLA2 TERPILIH!"
            exit 1
          fi

          echo "OK: Carambola2 tidak terpilih."

      - name: Download
        run: |
          cd openwrt

          make download -j$(nproc)

      - name: Build Firmware
        run: |
          cd openwrt

          make -j$(nproc) V=s

      - name: Show Firmware
        run: |
          cd openwrt

          echo "================================"
          echo "BUILD RESULT"
          echo "================================"

          find bin/targets/ath79/generic \
            -maxdepth 1 \
            -type f \
            -name "*.bin" \
            -printf "%f\n" \
            | sort

      - nam
```
