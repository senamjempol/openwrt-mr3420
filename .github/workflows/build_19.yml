name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      OPENWRT_DIR: openwrt

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # =========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ca-certificates \
            python3 \
            python3-distutils

          echo "======================================"
          echo "BUILD DEPENDENCIES"
          echo "======================================"

          gcc --version | head -1
          make --version | head -1
          python3 --version


      # =========================================================
      # 3. INSTALL PYTHON 2.7
      # OpenWrt 19.07 membutuhkan Python 2
      # =========================================================
      - name: Install Python 2.7
        run: |
          cd /tmp

          wget -q \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/opt/python2 \
            --enable-unicode=ucs4 \
            --without-ensurepip

          make -j$(nproc)

          sudo make install

          sudo ln -sf \
            /opt/python2/bin/python2.7 \
            /usr/local/bin/python

          sudo ln -sf \
            /opt/python2/bin/python2.7 \
            /usr/local/bin/python2

          echo "/opt/python2/bin" >> "$GITHUB_PATH"

          echo "======================================"
          echo "PYTHON VERSION"
          echo "======================================"

          /opt/python2/bin/python2.7 --version
          python --version
          python2 --version


      # =========================================================
      # 4. CLONE OPENWRT 19.07.9
      # =========================================================
      - name: Clone OpenWrt 19.07.9
        run: |
          rm -rf "$OPENWRT_DIR"

          git clone \
            --depth=1 \
            --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          echo "======================================"
          echo "OPENWRT SOURCE"
          echo "======================================"

          pwd
          ls -lah "$OPENWRT_DIR"

          test -f "$OPENWRT_DIR/Makefile"


      # =========================================================
      # 5. CREATE MR3420 V3 DTS
      # =========================================================
      - name: Create TL-MR3420 v3 DTS
        run: |
          cat > "$OPENWRT_DIR/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts" <<'EOF'
          /dts-v1/;

          #include "qca9533.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
              model = "TP-Link TL-MR3420 v3";

              aliases {
                  led-boot = &led_system;
                  led-failsafe = &led_system;
                  led-running = &led_system;
                  led-upgrade = &led_system;
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "green:system";
                      gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
                  };

                  usb {
                      label = "green:usb";
                      gpios = <&gpio 4 GPIO_ACTIVE_LOW>;
                  };

                  wps {
                      label = "green:wps";
                      gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      linux,code = <KEY_RESTART>;
                      gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };

                  wps {
                      label = "wps";
                      linux,code = <KEY_WPS_BUTTON>;
                      gpios = <&gpio 2 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };
              };
          };

          &spi {
              status = "okay";

              flash@0 {
                  compatible = "jedec,spi-nor";
                  reg = <0>;
                  spi-max-frequency = <25000000>;

                  partitions {
                      compatible = "fixed-partitions";
                      #address-cells = <1>;
                      #size-cells = <1>;

                      partition@0 {
                          label = "u-boot";
                          reg = <0x000000 0x020000>;
                          read-only;
                      };

                      firmware: partition@20000 {
                          label = "firmware";
                          reg = <0x020000 0x7d0000>;
                      };

                      art: partition@7f0000 {
                          label = "art";
                          reg = <0x7f0000 0x010000>;
                          read-only;
                      };
                  };
              };
          };

          &eth0 {
              status = "okay";
          };

          &eth1 {
              status = "okay";
          };

          &wmac {
              status = "okay";
              mtd-cal-data = <&art 0x1000>;
          };

          &usb {
              status = "okay";
          };

          &uart {
              status = "okay";
          };
          EOF

          echo "======================================"
          echo "DTS CREATED"
          echo "======================================"

          ls -lh \
            "$OPENWRT_DIR/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts"


      # =========================================================
      # 6. ADD MR3420 V3 IMAGE DEFINITION
      # =========================================================
      - name: Add TL-MR3420 v3 image definition
        run: |
          FILE="$OPENWRT_DIR/target/linux/ath79/image/tiny-tp-link.mk"

          cat >> "$FILE" <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-4mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_DTS := qca9531_tplink_tl-mr3420-v3
            TPLINK_FLASHLAYOUT := 8Mlzma
            IMAGE_SIZE := 7936k
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += tl-mr3420-v3
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF

          echo "======================================"
          echo "IMAGE DEFINITION"
          echo "======================================"

          grep -n \
            -A15 \
            "tplink_tl-mr3420-v3" \
            "$FILE"


      # =========================================================
      # 7. UPDATE FEEDS
      # =========================================================
      - name: Update feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # =========================================================
      # 8. CREATE CONFIGURATION
      # =========================================================
      - name: Create OpenWrt configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_ath9k-firmware=y
          CONFIG_PACKAGE_wpad-basic=y

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y

          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF

          echo "======================================"
          echo "CONFIG CREATED"
          echo "======================================"

          cat .config


      # =========================================================
      # 9. DEFCONFIG
      # =========================================================
      - name: Run defconfig
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo "Python:"
          python --version

          make defconfig

          echo "======================================"
          echo "TARGET CONFIGURATION"
          echo "======================================"

          grep "^CONFIG_TARGET" .config

          echo "======================================"
          echo "MR3420 CONFIGURATION"
          echo "======================================"

          grep "mr3420" .config || true


      # =========================================================
      # 10. CHECK PREREQUISITES
      # =========================================================
      - name: Check OpenWrt prerequisites
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo "======================================"
          echo "OPENWRT PREREQUISITES"
          echo "======================================"

          python --version

          make prereq


      # =========================================================
      # 11. DOWNLOAD SOURCES
      # =========================================================
      - name: Download sources
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make download -j$(nproc)


      # =========================================================
      # 12. BUILD
      # =========================================================
      - name: Build OpenWrt
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo "======================================"
          echo "BUILD START"
          echo "======================================"

          make -j$(nproc) V=s


      # =========================================================
      # 13. DISPLAY BUILD RESULTS
      # =========================================================
      - name: Display build results
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo "======================================"
          echo "ALL BUILD OUTPUT"
          echo "======================================"

          find bin/targets \
            -type f \
            -exec ls -lh {} \;


          echo ""
          echo "======================================"
          echo "FIRMWARE ONLY"
          echo "======================================"

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec ls -lh {} \;


      # =========================================================
      # 14. CREATE CLEAN ARTIFACT DIRECTORY
      # =========================================================
      - name: Create clean firmware directory
        run: |
          rm -rf firmware
          mkdir -p firmware

          find "$OPENWRT_DIR/bin/targets" \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec cp {} firmware/ \;


      # =========================================================
      # 15. REMOVE UNNECESSARY FILES
      # =========================================================
      - name: Clean artifact directory
        run: |
          find firmware \
            -type f \
            ! \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -delete

          echo "======================================"
          echo "CLEAN FIRMWARE DIRECTORY"
          echo "======================================"

          find firmware -maxdepth 1 -type f -exec ls -lh {} \;


      # =========================================================
      # 16. CHECK ARTIFACT SIZE
      # =========================================================
      - name: Check artifact size
        run: |
          SIZE_KB=$(du -sk firmware | cut -f1)

          echo "======================================"
          echo "ARTIFACT SIZE"
          echo "======================================"

          du -sh firmware

          echo ""
          echo "Size: ${SIZE_KB} KB"

          # Firmware router 8MB tidak boleh mendekati 1GB.
          if [ "$SIZE_KB" -gt 50000 ]; then
            echo ""
            echo "ERROR: Artifact terlalu besar!"
            echo "Kemungkinan source/build directory ikut masuk."
            exit 1
          fi


      # =========================================================
      # 17. CHECK THAT OPENWRT IS NOT INSIDE FIRMWARE
      # =========================================================
      - name: Verify artifact isolation
        run: |
          echo "======================================"
          echo "ARTIFACT ISOLATION CHECK"
          echo "======================================"

          if find firmware \
            -type f \
            | grep -E '/(openwrt|build_dir|staging_dir|dl|tmp)/'; then

            echo "ERROR: build directory terdeteksi di firmware!"
            exit 1
          fi

          echo "OK - hanya firmware yang akan di-upload."


      # =========================================================
      # 18. GENERATE SHA256
      # =========================================================
      - name: Generate SHA256
        run: |
          cd firmware

          sha256sum \
            *.bin \
            *.img \
            *.img.gz \
            *.itb \
            2>/dev/null > sha256sums.txt || true

          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat sha256sums.txt


      # =========================================================
      # 19. FINAL FILE LIST
      # =========================================================
      - name: Final artifact check
        run: |
          echo "======================================"
          echo "FINAL ARTIFACT"
          echo "======================================"

          du -sh firmware

          find firmware \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;


      # =========================================================
      # 20. UPLOAD FIRMWARE ONLY
      # =========================================================
      - name: Upload firmware ONLY
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-19.07.9-TL-MR3420-v3-8MB
          path: firmware/*
          if-no-files-found: error
          compression-level: 9
