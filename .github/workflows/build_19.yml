name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            swig \
            time \
            ccache

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Install Python 2.7
        run: |
          cd /tmp

          wget -q \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar xf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/usr/local \
            --enable-optimizations=no

          make -j2

          sudo make altinstall

          sudo ln -sf \
            /usr/local/bin/python2.7 \
            /usr/local/bin/python

          python --version

      - name: Check existing MR3420 files
        working-directory: openwrt
        run: |
          echo "DTS:"
          find target/linux/ath79/dts \
            -iname "*mr3420*" \
            -print

          echo
          echo "IMAGE DEFINITIONS:"
          grep -R -n \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image \
            || true

      - name: Configure MR3420 device
        working-directory: openwrt
        run: |

          mkdir -p target/linux/ath79/dts

          cat > target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts <<'EOF'
/dts-v1/;

#include "qca9533.dtsi"

/ {
    compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
    model = "TP-Link TL-MR3420 v3";

    aliases {
        led-boot = &led_system;
        led-failsafe = &led_system;
        led-running = &led_system;
        led-upgrade = &led_system;
    };

    leds {
        compatible = "gpio-leds";

        led_system: system {
            label = "green:system";
            gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
        };

        usb {
            label = "green:usb";
            gpios = <&gpio 8 GPIO_ACTIVE_LOW>;
        };

        wlan {
            label = "green:wlan";
            gpios = <&gpio 9 GPIO_ACTIVE_LOW>;
        };
    };

    keys {
        compatible = "gpio-keys";

        reset {
            label = "reset";
            linux,code = <KEY_RESTART>;
            gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
        };

        wps {
            label = "WPS";
            linux,code = <KEY_WPS_BUTTON>;
            gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
        };
    };
};

&spi {
    status = "okay";

    flash@0 {
        compatible = "jedec,spi-nor";
        reg = <0>;
        spi-max-frequency = <25000000>;

        partitions {
            compatible = "fixed-partitions";
            #address-cells = <1>;
            #size-cells = <1>;

            partition@0 {
                label = "u-boot";
                reg = <0x000000 0x020000>;
                read-only;
            };

            partition@20000 {
                label = "firmware";
                reg = <0x020000 0x7d0000>;
            };

            partition@7f0000 {
                label = "art";
                reg = <0x7f0000 0x010000>;
                read-only;
            };
        };
    };
};

&uart {
    status = "okay";
};

&usb {
    status = "okay";
};

&wmac {
    status = "okay";
};
EOF

          if ! grep -q \
            "define Device/tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk
          then

            cat >> target/linux/ath79/image/tiny-tp-link.mk <<'EOF'

define Device/tplink_tl-mr3420-v3
  $(Device/tplink-8mlzma)
  SOC := qca9531
  DEVICE_VENDOR := TP-Link
  DEVICE_MODEL := TL-MR3420
  DEVICE_VARIANT := v3
  TPLINK_HWID := 0x34200003
  DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
endef

TARGET_DEVICES += tplink_tl-mr3420-v3

EOF
          fi

          echo
          echo "=== MR3420 DEVICE ==="

          grep -A12 \
            "define Device/tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create configuration
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'
CONFIG_TARGET_ath79=y
CONFIG_TARGET_ath79_tiny=y
CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y

CONFIG_TARGET_ROOTFS_SQUASHFS=y

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y

CONFIG_PACKAGE_kmod-ath9k=y
CONFIG_PACKAGE_wpad-mini=y

CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y
EOF

          echo "=== BEFORE DEFCONFIG ==="
          cat .config

          make defconfig

          echo
          echo "=== AFTER DEFCONFIG ==="

          grep -E \
            "CONFIG_TARGET_ath79|CONFIG_TARGET_DEVICE" \
            .config

      - name: Verify MR3420 profile
        working-directory: openwrt
        run: |

          if grep -q \
            "^CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y" \
            .config
          then
            echo
            echo "================================"
            echo "MR3420 V3 PROFILE SELECTED"
            echo "================================"
          else
            echo
            echo "================================"
            echo "ERROR: MR3420 PROFILE TIDAK DIPILIH"
            echo "================================"
            exit 1
          fi

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j4 V=s

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Inspect build result
        working-directory: openwrt
        run: |

          echo
          echo "================================"
          echo "TARGET DIRECTORY"
          echo "================================"

          find bin/targets \
            -type f \
            -printf "%s %p\n" \
            | sort -nr \
            | head -100

          echo
          echo "================================"
          echo "MR3420 FILES"
          echo "================================"

          find bin/targets \
            -type f \
            | grep -i "mr3420" \
            || true

          echo
          echo "================================"
          echo "ALL IMAGE FILES"
          echo "================================"

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec ls -lh {} \;

      - name: Collect MR3420 firmware
        working-directory: openwrt
        run: |

          rm -rf firmware
          mkdir -p firmware

          find bin/targets \
            -type f \
            \( \
              -iname "*mr3420*.bin" \
              -o -iname "*mr3420*.img" \
              -o -iname "*mr3420*.img.gz" \
              -o -iname "*mr3420*.itb" \
            \) \
            -exec cp {} firmware/ \;

          echo
          echo "================================"
          echo "COLLECTED FIRMWARE"
          echo "================================"

          ls -lah firmware

          COUNT=$(find firmware -type f | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo
            echo "ERROR: FIRMWARE MR3420 TIDAK DITEMUKAN"
            exit 1
          fi

          SIZE=$(du -sk firmware | awk '{print $1}')

          echo
          echo "Firmware size: ${SIZE} KB"

          if [ "$SIZE" -gt 20000 ]; then
            echo
            echo "ERROR: FIRMWARE DIRECTORY TERLALU BESAR"
            exit 1
          fi

      - name: Generate checksums
        working-directory: openwrt
        run: |
          cd firmware
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Final check
        working-directory: openwrt
        run: |
          echo
          echo "================================"
          echo "FINAL FILES"
          echo "================================"

          ls -lah firmware

          echo
          du -sh firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-19.07.9-TL-MR3420-v3-8MB
          path: openwrt/firmware/*
          if-no-files-found: error
          retention-days: 7
