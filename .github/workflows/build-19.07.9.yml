name: Build OpenWrt 19.07.9 MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl libffi-dev

          # OpenWrt 19.07.9 requires the host command "python" to be Python 2.x.
          # Ubuntu 22.04 no longer ships Python 2, so build a private Python 2.7.18.
          cd /tmp
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/python2.7 --enable-unicode=ucs4
          make -j2
          sudo make install
          sudo ln -sf /opt/python2.7/bin/python2.7 /usr/local/bin/python
          python --version

      - name: Clone exact OpenWrt 19.07.9 source
        run: |
          git clone --branch v19.07.9 --single-branch https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout v19.07.9
          git describe --tags --always

      - name: Port TL-MR3420 v3 and prepare 8MB image
        run: |
          cd openwrt

          DTS="target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts"
          TINY="target/linux/ath79/image/tiny-tp-link.mk"
          COMMON="target/linux/ath79/image/common-tp-link.mk"

          mkdir -p "$(dirname "$DTS")"
          cat > "$DTS" <<'DTS_EOF'
          /dts-v1/;
          
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>
          #include "qca953x.dtsi"
          
          / {
          compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
          model = "TP-Link TL-MR3420 v3";
          
          aliases {
          led-boot = &led_system;
          led-failsafe = &led_system;
          led-running = &led_system;
          led-upgrade = &led_system;
          };
          
          led_spi {
          compatible = "spi-gpio";
          #address-cells = <1>;
          #size-cells = <0>;
          gpio-sck = <&gpio 15 GPIO_ACTIVE_HIGH>;
          gpio-mosi = <&gpio 16 GPIO_ACTIVE_HIGH>;
          cs-gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
          num-chipselects = <1>;
          
          led_gpio: led_gpio@0 {
          compatible = "fairchild,74hc595";
          reg = <0>;
          gpio-controller;
          #gpio-cells = <2>;
          registers-number = <1>;
          spi-max-frequency = <10000000>;
          };
          };

          gpio-export {
          compatible = "gpio-export";

          gpio_shift_register_oe {
          gpio-export,name = "tp-link:oe:sr";
          gpio-export,output = <0>;
          gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
          };

          gpio_shift_register_reset {
          gpio-export,name = "tp-link:reset:sr";
          gpio-export,output = <1>;
          gpios = <&gpio 14 GPIO_ACTIVE_LOW>;
          };
          };
          
          leds {
          compatible = "gpio-leds";

          led_system: system {
          label = "green:power";
          gpios = <&gpio 1 GPIO_ACTIVE_LOW>;
          default-state = "on";
          };

          wlan {
          label = "green:wlan";
          gpios = <&led_gpio 6 GPIO_ACTIVE_LOW>;
          linux,default-trigger = "phy0tpt";
          };

          lan1 { label = "green:lan1"; gpios = <&led_gpio 3 GPIO_ACTIVE_LOW>; };
          lan2 { label = "green:lan2"; gpios = <&led_gpio 2 GPIO_ACTIVE_LOW>; };
          lan3 { label = "green:lan3"; gpios = <&led_gpio 1 GPIO_ACTIVE_LOW>; };
          lan4 { label = "green:lan4"; gpios = <&led_gpio 0 GPIO_ACTIVE_LOW>; };

          wan { label = "green:wan"; gpios = <&led_gpio 4 GPIO_ACTIVE_LOW>; };
          wan_fail { label = "orange:wan"; gpios = <&led_gpio 5 GPIO_ACTIVE_LOW>; };

          usb {
          label = "green:usb";
          gpios = <&led_gpio 7 GPIO_ACTIVE_LOW>;
          linux,default-trigger = "usbport";
          };

          qss {
          label = "green:qss";
          gpios = <&gpio 3 GPIO_ACTIVE_LOW>;
          };
          };
          
          keys {
          compatible = "gpio-keys-polled";
          poll-interval = <20>;
          reset {
          label = "Reset button";
          linux,code = <KEY_RESTART>;
          gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
          };
          rfkill {
          label = "RF kill button";
          linux,code = <KEY_RFKILL>;
          gpios = <&gpio 17 GPIO_ACTIVE_LOW>;
          };
          };
          };
          
          &spi {
          status = "okay";
          flash@0 {
          compatible = "jedec,spi-nor";
          reg = <0>;
          spi-max-frequency = <25000000>;
          partitions {
          compatible = "fixed-partitions";
          #address-cells = <1>;
          #size-cells = <1>;
          
          uboot: partition@0 {
          label = "u-boot";
          reg = <0x000000 0x020000>;
          read-only;
          };
          
          firmware: partition@20000 {
          compatible = "tplink,firmware";
          label = "firmware";
          reg = <0x020000 0x7d0000>;
          };
          
          art: partition@7f0000 {
          label = "art";
          reg = <0x7f0000 0x010000>;
          read-only;
          };
          };
          };
          };
          
          &eth0 {
          status = "okay";
          phy-handle = <&swphy4>;
          mtd-mac-address = <&uboot 0x1fc00>;
          };
          
          &eth1 {
          status = "okay";
          mtd-mac-address = <&uboot 0x1fc00>;
          mtd-mac-address-increment = <1>;
          };
          
          &wmac {
          status = "okay";
          mtd-mac-address = <&uboot 0x1fc00>;
          mtd-mac-address-increment = <2>;
          mtd-cal-data = <&art 0x1000>;
          };
          
          &usb0 { status = "okay"; };
          &usb_phy { status = "okay"; };
          
          DTS_EOF

          # Add an 8MiB TP-Link LZMA layout if this old source tree does not have it.
          if ! grep -q '^define Device/tplink-8mlzma' "$COMMON"; then
            cat >> "$COMMON" <<'EOF'

          define Device/tplink-8mlzma
            $(Device/tplink)
            TPLINK_FLASHLAYOUT := 8Mlzma
            IMAGE_SIZE := 7936k
          endef
          EOF
          fi

          # Add the MR3420 v3 device definition because 19.07.9 does not ship it.
          if ! grep -q 'TARGET_DEVICES += tplink_tl-mr3420-v3' "$TINY"; then
            cat >> "$TINY" <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-8mlzma)
            ATH_SOC := qca9531
            DEVICE_TITLE := TP-Link TL-MR3420 v3
            TPLINK_HWID := 0x34200003
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += tl-mr3420-v3
          endef
          TARGET_DEVICES += tplink_tl-mr3420-v3
          EOF
          fi

          grep -n -A10 'define Device/tplink_tl-mr3420-v3' "$TINY"
          grep -n -A5 'define Device/tplink-8mlzma' "$COMMON"
          test -f "$DTS"

      - name: Update official feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure minimal firmware
        run: |
          cd openwrt
          rm -f .config

          cat > .config <<'EOF'
          # Target: TP-Link TL-MR3420 v3, 8MB flash / 32MB-class RAM.
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_tiny=y
          CONFIG_TARGET_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y

          # Remove IPv6 to save flash/RAM on this 8MB target.
          # CONFIG_IPV6 is not set

          # Essential LuCI.
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-lib-base=y
          CONFIG_PACKAGE_luci-lib-ip=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_libiwinfo-lua=y

          # LuCI/RPC web server.
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          # Software menu / package manager.
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_luci-app-opkg=y

          # Network > Firewall for OpenWrt 19.07 (iptables stack).
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_luci-app-firewall=y

          # openNDS: installed; disabled by default through first-boot init script.
          CONFIG_PACKAGE_opennds=y

          # Huawei M150-2 USB 3G/serial support only.
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usb-modeswitch-data=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          # Indonesian LuCI.
          CONFIG_LUCI_LANG_id=y
          EOF

          make defconfig

          echo "=== Target ==="
          grep '^CONFIG_TARGET_ath79' .config

          echo "=== Required target ==="
          grep '^CONFIG_TARGET_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y' .config

          echo "=== Important packages ==="
          grep -E '^(CONFIG_PACKAGE_(luci-theme-material|luci-app-opkg|luci-app-firewall|firewall|iptables|opennds|kmod-usb2|kmod-usb-serial-option|kmod-usb-serial-wwan|comgt|usb-modeswitch|usb-modeswitch-data)|# CONFIG_IPV6)' .config

          test "$(grep -c '^CONFIG_TARGET_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_opennds=y' .config)" -eq 1
          
      - name: Add first-boot defaults, voucher hotspot and 19.07.9 package feeds
        run: |
          cd openwrt

          mkdir -p files/etc/uci-defaults

          # Indonesia (Jakarta / WIB, UTC+7).
          mkdir -p files/etc/config
          cat > files/etc/config/system <<'EOF'
          config system
              option hostname 'OpenWrt'
              option timezone 'WIB-7'
              option zonename 'Asia/Jakarta'
              option ttylogin '0'
              option log_size '128'
              option urandom_seed '0'

          config timeserver 'ntp'
              option enabled '1'
              option enable_server '0'
              list server '0.openwrt.pool.ntp.org'
              list server '1.openwrt.pool.ntp.org'
              list server '2.openwrt.pool.ntp.org'
              list server '3.openwrt.pool.ntp.org'
          EOF

          cat > files/etc/uci-defaults/99-default-settings <<'EOF'
          # Generate wireless config if it does not exist yet.
          [ -s /etc/config/wireless ] || /sbin/wifi config

          # Default LAN address.
          uci -q set network.lan.proto='static'
          uci -q set network.lan.ipaddr='192.168.1.1'
          uci -q set network.lan.netmask='255.255.255.0'
          uci -q delete network.lan.gateway
          uci -q delete network.lan.dns
          uci -q commit network

          # Enable the radio.
          for radio in $(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-device$/\1/p'); do
            uci -q set "wireless.$radio.disabled=0"
          done

          # Keep the existing/default AP enabled.
          if uci -q get wireless.@wifi-iface[0].ssid >/dev/null 2>&1; then
            uci -q set wireless.@wifi-iface[0].disabled='0'
          fi

          uci -q commit wireless
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-default-settings

          cat > files/etc/uci-defaults/98-voucher-hotspot <<'EOF'
          # Dedicated voucher bridge for the HOTSPOT AP.
          uci -q set network.br_voucher='device'
          uci -q set network.br_voucher.name='br-voucher'
          uci -q set network.br_voucher.type='bridge'

          uci -q set network.voucher='interface'
          uci -q set network.voucher.device='br-voucher'
          uci -q set network.voucher.proto='static'
          uci -q set network.voucher.ipaddr='10.10.10.1'
          uci -q set network.voucher.netmask='255.255.255.0'
          uci -q delete network.voucher.gateway
          uci -q delete network.voucher.dns

          # Small DHCP pool appropriate for the MR3420 v3.
          uci -q set dhcp.voucher='dhcp'
          uci -q set dhcp.voucher.interface='voucher'
          uci -q set dhcp.voucher.start='100'
          uci -q set dhcp.voucher.limit='30'
          uci -q set dhcp.voucher.leasetime='12h'

          # Add the open HOTSPOT AP on the first radio.
          radio=$(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-device$/\1/p' | head -n 1)
          if [ -n "$radio" ]; then
            uci -q set wireless.voucher_ap='wifi-iface'
            uci -q set wireless.voucher_ap.device="$radio"
            uci -q set wireless.voucher_ap.mode='ap'
            uci -q set wireless.voucher_ap.ssid='HOTSPOT'
            uci -q set wireless.voucher_ap.encryption='none'
            uci -q set wireless.voucher_ap.network='voucher'
            uci -q set wireless.voucher_ap.disabled='0'
          fi

          uci -q commit network
          uci -q commit dhcp
          uci -q commit wireless
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/98-voucher-hotspot

          cat > files/etc/uci-defaults/97-voucher-firewall <<'EOF'
          # Voucher clients may reach the Internet but not router management.
          zone=$(uci add firewall zone)
          uci -q set "firewall.$zone.name=voucher"
          uci -q set "firewall.$zone.network=voucher"
          uci -q set "firewall.$zone.input=REJECT"
          uci -q set "firewall.$zone.output=ACCEPT"
          uci -q set "firewall.$zone.forward=REJECT"
          uci -q set "firewall.$zone.masq=1"

          forward=$(uci add firewall forwarding)
          uci -q set "firewall.$forward.src=voucher"
          uci -q set "firewall.$forward.dest=wan"

          # DHCP.
          rule=$(uci add firewall rule)
          uci -q set "firewall.$rule.name=Allow-DHCP-Voucher"
          uci -q set "firewall.$rule.src=voucher"
          uci -q set "firewall.$rule.proto=udp"
          uci -q set "firewall.$rule.dest_port=67"
          uci -q set "firewall.$rule.target=ACCEPT"

          # DNS.
          rule=$(uci add firewall rule)
          uci -q set "firewall.$rule.name=Allow-DNS-Voucher"
          uci -q set "firewall.$rule.src=voucher"
          uci -q set "firewall.$rule.proto='tcp udp'"
          uci -q set "firewall.$rule.dest_port=53"
          uci -q set "firewall.$rule.target=ACCEPT"

          uci -q commit firewall
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/97-voucher-firewall

          # Install OpenNDS configuration and voucher files from repository root.
          mkdir -p files/etc/config files/etc/opennds files/usr/lib/opennds
          cp ../opennds files/etc/config/opennds
          cp ../voucher.sh files/usr/lib/opennds/voucher.sh
          cp ../vouchers files/etc/opennds/vouchers
          chmod 755 files/usr/lib/opennds/voucher.sh

          cat > files/etc/uci-defaults/96-disable-opennds <<'EOF'
          # Keep OpenNDS installed/configured, but disabled by default.
          if [ -f /etc/config/opennds ]; then
            uci -q set opennds.@opennds[0].gatewayinterface='br-voucher'
            uci -q commit opennds
          fi

          if [ -x /etc/init.d/opennds ]; then
            /etc/init.d/opennds stop 2>/dev/null || true
            /etc/init.d/opennds disable 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/96-disable-opennds

          # Keep only the 19.07.9 feeds needed by this build.
          mkdir -p files/etc/opkg
          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz openwrt_core https://downloads.openwrt.org/releases/19.07.9/targets/ath79/tiny/packages
          src/gz openwrt_base https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/base
          src/gz openwrt_luci https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/luci
          src/gz openwrt_packages https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/packages
          src/gz openwrt_routing https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/routing
          src/gz openwrt_telephony https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/telephony
          EOF

          echo "=== Package feeds ==="
          grep -n '^src/gz' files/etc/opkg/distfeeds.conf
          

      - name: Download sources
        run: |
          cd openwrt
          make download -j2

      - name: Build
        run: |
          cd openwrt
          make -j2 V=s

      - name: Verify firmware
        run: |
          cd openwrt
          ls -lh bin/targets/ath79/tiny/
          ls -lh bin/targets/ath79/tiny/*mr3420-v3*.bin || true
          test -n "$(find bin/targets/ath79/tiny -maxdepth 1 -name '*mr3420-v3*.bin' -print -quit)"
          for f in bin/targets/ath79/tiny/*mr3420-v3*.bin; do
            bytes=$(stat -c '%s' "$f")
            echo "$f: $bytes bytes"
            test "$bytes" -le 8126464
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-mr3420-v3-8mb
          path: |
            openwrt/bin/targets/ath79/tiny/*mr3420-v3*.bin
            openwrt/bin/targets/ath79/tiny/sha256sums
