name: Build OpenWrt 21.02 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt
        run: |
          git clone --depth 1 --branch openwrt-21.02 https://github.com/openwrt/openwrt.git openwrt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc \
            swig \
            time

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch MR3420 v3 for 8MB flash
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dts = Path("target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts")
          s = dts.read_text()

          s = s.replace(
              'reg = <0x020000 0x3d0000>;',
              'reg = <0x020000 0x7d0000>;'
          )

          s = s.replace(
              'reg = <0x3f0000 0x010000>;',
              'reg = <0x7f0000 0x010000>;'
          )

          dts.write_text(s)
          PY

      - name: Create 8MB device definition
        working-directory: openwrt
        run: |
          cat >> target/linux/ath79/image/generic-tp-link.mk <<'EOF'

          define Device/tplink_tl-mr3420-v3-8m
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_DTS := qca9531_tplink_tl-mr3420-v3
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3 8MB
            TPLINK_HWID := 0x34200003
          endef
          TARGET_DEVICES += tplink_tl-mr3420-v3-8m
          EOF

      - name: Configure build
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3-8m=y

          # LuCI minimal
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-openwrt-2020=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          # Captive portal
          CONFIG_PACKAGE_opennds=y
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y

          # Huawei M150-2 / E3372
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_usb-modeswitch=y

          # IPv6 packages tidak digunakan
          CONFIG_PACKAGE_odhcp6c=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n
          CONFIG_PACKAGE_luci-proto-ipv6=n
          EOF

          make defconfig

          echo "=== DNSMASQ CONFIG ==="
          grep -E "^CONFIG_PACKAGE_(dnsmasq|dnsmasq-full)=" .config || true

      - name: Verify configuration
        working-directory: openwrt
        run: |
          echo "=== DEVICE ==="
          grep -E "CONFIG_TARGET_ath79_generic_DEVICE" .config

          echo "=== FLASH LAYOUT ==="
          grep -R -A5 -B2 "tplink_tl-mr3420-v3-8m" target/linux/ath79/image/

          echo "=== DTS PARTITIONS ==="
          grep -A8 -B2 "partition@20000" target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          echo "=== PACKAGES ==="
          grep -E "opennds|luci-base|luci-mod-admin|kmod-usb-net|huawei" .config

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j2

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      - name: List firmware
        working-directory: openwrt
        run: |
          find bin/targets/ath79/generic -type f -maxdepth 2 -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mr3420-v3-8mb
          path: openwrt/bin/targets/ath79/generic/*
