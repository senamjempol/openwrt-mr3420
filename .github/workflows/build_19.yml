```yaml
name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT OPENWRT 19.07.9
      # ============================================================
      - name: Checkout OpenWrt 19.07.9
        run: |
          git clone --depth 1 \
            --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      # ============================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc \
            swig \
            time \
            ccache

      # ============================================================
      # 3. UPDATE FEEDS
      # ============================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 4. SHOW ORIGINAL TP-LINK IMAGE DEFINITIONS
      # ============================================================
      - name: Inspect TP-Link image system
        working-directory: openwrt
        run: |
          echo "===== common-tp-link.mk ====="
          sed -n '1,240p' target/linux/ath79/image/common-tp-link.mk

          echo
          echo "===== tiny-tp-link.mk ====="
          sed -n '1,180p' target/linux/ath79/image/tiny-tp-link.mk

      # ============================================================
      # 5. CREATE MR3420 V3 DTS
      # ============================================================
      - name: Create TL-MR3420 v3 DTS
        working-directory: openwrt
        run: |

          cat > target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts <<'EOF'
          #include "qca953x.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "tplink,tl-mr3420-v3",
                           "qca,qca9531";

              model = "TP-Link TL-MR3420 v3";

              aliases {
                  led-boot = &led_system;
                  led-failsafe = &led_system;
                  led-running = &led_system;
                  led-upgrade = &led_system;
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "green:system";
                      gpios = <&gpio 14 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      linux,code = <KEY_RESTART>;
                      gpios = <&gpio 3 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };

                  wps {
                      label = "wps";
                      linux,code = <KEY_WPS_BUTTON>;
                      gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };
              };
          };

          &spi {
              status = "okay";

              flash@0 {
                  compatible = "jedec,spi-nor";
                  reg = <0>;
                  spi-max-frequency = <25000000>;

                  partitions {
                      compatible = "fixed-partitions";
                      #address-cells = <1>;
                      #size-cells = <1>;

                      partition@0 {
                          label = "u-boot";
                          reg = <0x000000 0x020000>;
                          read-only;
                      };

                      /*
                       * 8 MB SPI NOR
                       *
                       * U-Boot : 0x000000 - 0x01ffff
                       * Firmware: 0x020000 - 0x7effff
                       * ART     : 0x7f0000 - 0x7fffff
                       */

                      partition@20000 {
                          compatible = "tplink,firmware";
                          label = "firmware";
                          reg = <0x020000 0x7d0000>;
                      };

                      partition@7f0000 {
                          label = "art";
                          reg = <0x7f0000 0x010000>;
                          read-only;
                      };
                  };
              };
          };

          &wmac {
              status = "okay";
          };

          &uart {
              status = "okay";
          };
          EOF

          echo "===== MR3420 DTS ====="
          cat target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

      # ============================================================
      # 6. CREATE 8MB TP-LINK IMAGE DEFINITION
      # ============================================================
      - name: Create 8MB TP-Link image definition
        working-directory: openwrt
        run: |

          cat >> target/linux/ath79/image/common-tp-link.mk <<'EOF'

          /*
           * TL-MR3420 v3 modified to 8 MB SPI NOR
           *
           * Flash layout:
           *   0x000000 - 0x01ffff : u-boot
           *   0x020000 - 0x7effff : firmware
           *   0x7f0000 - 0x7fffff : art
           */

          define Device/tplink-8mlzma-mr3420
              $(Device/tplink-4mlzma)
              TPLINK_FLASHLAYOUT := 8Mlzma
              IMAGE_SIZE := 8000k
          endef
          EOF

          echo "===== 8MB DEVICE DEFINITION ====="
          tail -40 target/linux/ath79/image/common-tp-link.mk

      # ============================================================
      # 7. CREATE MR3420 V3 DEVICE PROFILE
      # ============================================================
      - name: Create TL-MR3420 v3 8MB device profile
        working-directory: openwrt
        run: |

          cat >> target/linux/ath79/image/tiny-tp-link.mk <<'EOF'

          define Device/tplink_tl-mr3420-v3-8m
              $(Device/tplink-8mlzma-mr3420)

              SOC := qca9531

              DEVICE_MODEL := TL-MR3420
              DEVICE_VARIANT := v3 8MB

              DEVICE_DTS := qca9531_tplink_tl-mr3420-v3

              TPLINK_HWID := 0x34200003

              SUPPORTED_DEVICES += tl-mr3420-v3
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3-8m
          EOF

          echo "===== MR3420 DEVICE ====="
          tail -30 target/linux/ath79/image/tiny-tp-link.mk

      # ============================================================
      # 8. VERIFY TARGET DEVICE IS DETECTED
      # ============================================================
      - name: Verify MR3420 device definition
        working-directory: openwrt
        run: |
          echo "===== MR3420 SEARCH ====="

          grep -R -n \
            "tplink_tl-mr3420-v3-8m" \
            target/linux/ath79/image/

          echo
          echo "===== DTS SEARCH ====="

          grep -R -n \
            "tl-mr3420-v3" \
            target/linux/ath79/dts/

      # ============================================================
      # 9. CREATE BUILD CONFIG
      # ============================================================
      - name: Configure OpenWrt
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3-8m=y

          # ========================================================
          # LuCI
          # ========================================================

          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-openwrt-2020=y

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          # ========================================================
          # openNDS
          # ========================================================

          CONFIG_PACKAGE_opennds=y

          # dnsmasq-full menggantikan dnsmasq biasa
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y

          # ========================================================
          # USB
          # ========================================================

          CONFIG_PACKAGE_kmod-usb2=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y

          CONFIG_PACKAGE_usb-modeswitch=y

          # ========================================================
          # IPv6 disabled untuk menghemat ruang
          # ========================================================

          CONFIG_PACKAGE_odhcp6c=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n
          CONFIG_PACKAGE_luci-proto-ipv6=n

          EOF

          # Generate dependency configuration
          make defconfig

      # ============================================================
      # 10. VERIFY FINAL CONFIG
      # ============================================================
      - name: Verify final configuration
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -E \
            "^CONFIG_TARGET_ath79|^CONFIG_TARGET_.*DEVICE" \
            .config || true

          echo
          echo "========================================"
          echo "DNSMASQ"
          echo "========================================"

          grep -E \
            "^CONFIG_PACKAGE_(dnsmasq|dnsmasq-full)=" \
            .config || true

          echo
          echo "========================================"
          echo "OPENNDS"
          echo "========================================"

          grep -E \
            "^CONFIG_PACKAGE_opennds=" \
            .config || true

          echo
          echo "========================================"
          echo "USB / HUAWEI"
          echo "========================================"

          grep -E \
            "^CONFIG_PACKAGE_(kmod-usb|usb-modeswitch)" \
            .config || true

          echo
          echo "========================================"
          echo "IMAGE SIZE"
          echo "========================================"

          grep -R -n \
            -E "8mlzma-mr3420|IMAGE_SIZE := 8000k|tplink_tl-mr3420-v3-8m" \
            target/linux/ath79/image/

      # ============================================================
      # 11. DOWNLOAD SOURCES
      # ============================================================
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j2 V=s

      # ============================================================
      # 12. BUILD
      # ============================================================
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      # ============================================================
      # 13. CHECK RESULT
      # ============================================================
      - name: Check firmware
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          find bin/targets/ath79/generic \
            -maxdepth 2 \
            -type f \
            -printf '%p\n'

          echo
          echo "========================================"
          echo "FIRMWARE SIZE"
          echo "========================================"

          find bin/targets/ath79/generic \
            -type f \
            \( -name "*.bin" -o -name "*.img" \) \
            -exec ls -lh {} \;

          echo
          echo "========================================"
          echo "FIRMWARE SIZE IN BYTES"
          echo "========================================"

          for f in bin/targets/ath79/generic/*.bin; do
              [ -f "$f" ] || continue
              stat -c "%n : %s bytes" "$f"
          done

      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-mr3420-v3-8mb
          path: |
            openwrt/bin/targets/ath79/generic/*.bin
            openwrt/bin/targets/ath79/generic/*.manifest
            openwrt/bin/targets/ath79/generic/*.json
            openwrt/bin/targets/ath79/generic/sha256sums
          if-no-files-found: error
```
