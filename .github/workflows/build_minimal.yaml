```yaml
name: Build OpenWrt 21.02 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc

      # ============================================================
      # 2. CLONE OPENWRT 21.02
      # ============================================================

      - name: Clone OpenWrt 21.02
        run: |
          git clone \
            --depth 1 \
            --branch openwrt-21.02 \
            https://github.com/openwrt/openwrt.git

          cd openwrt

          echo "=========================================="
          echo "OPENWRT SOURCE"
          echo "=========================================="

          git log -1 --oneline

      # ============================================================
      # 3. PATCH DTS MR3420 V3 UNTUK FLASH 8 MB
      #
      # FLASH:
      #
      # 000000 - 020000 : U-Boot
      # 020000 - 7F0000 : Firmware
      # 7F0000 - 800000 : ART
      #
      # Firmware = 0x7D0000 = 8000 KiB
      # ============================================================

      - name: Patch MR3420 v3 DTS for 8MB flash
        run: |
          cd openwrt

          DTS="target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts"

          echo "=========================================="
          echo "PATCHING DTS"
          echo "=========================================="

          test -f "$DTS"

          # Firmware 4MB -> 8MB
          sed -i \
            's/reg = <0x020000 0x3d0000>/reg = <0x020000 0x7d0000>/' \
            "$DTS"

          # ART 0x3f0000 -> 0x7f0000
          sed -i \
            's/partition@3f0000/partition@7f0000/' \
            "$DTS"

          sed -i \
            's/reg = <0x3f0000 0x010000>/reg = <0x7f0000 0x010000>/' \
            "$DTS"

          echo
          echo "===== FIRMWARE PARTITION ====="

          grep -A8 -B2 \
            'partition@20000' \
            "$DTS"

          echo
          echo "===== ART PARTITION ====="

          grep -A6 -B2 \
            'partition@7f0000' \
            "$DTS"

      # ============================================================
      # 4. PINDAHKAN MR3420 DARI TINY KE GENERIC
      # ============================================================

      - name: Add MR3420 v3 to ath79 generic
        run: |
          cd openwrt

          TINY="target/linux/ath79/image/tiny-tp-link.mk"
          GENERIC="target/linux/ath79/image/generic-tp-link.mk"

          echo "=========================================="
          echo "REMOVE MR3420 FROM TINY"
          echo "=========================================="

          sed -i \
            '/define Device\/tplink_tl-mr3420-v3/,/endef/d' \
            "$TINY"

          sed -i \
            '/TARGET_DEVICES += tplink_tl-mr3420-v3/d' \
            "$TINY"

          echo "=========================================="
          echo "ADD MR3420 TO GENERIC"
          echo "=========================================="

          cat >> "$GENERIC" <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_PACKAGES := \
              wpad-basic \
              kmod-usb2 \
              kmod-usb-net \
              kmod-usb-net-cdc-ncm \
              kmod-usb-net-huawei-cdc-ncm \
              kmod-usb-wdm \
              usb-modeswitch \
              dnsmasq-full \
              opennds \
              luci-base \
              luci-mod-admin-full \
              luci-theme-openwrt \
              uhttpd \
              uhttpd-mod-ubus
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3
          EOF

          echo
          echo "=========================================="
          echo "MR3420 DEVICE DEFINITION"
          echo "=========================================="

          grep -A30 \
            'define Device/tplink_tl-mr3420-v3' \
            "$GENERIC"

      # ============================================================
      # 5. FEEDS
      # ============================================================

      - name: Update feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 6. DEFAULT CONFIGURATION
      # ============================================================

      - name: Create default network configuration
        run: |
          cd openwrt

          mkdir -p files/etc/config

          # --------------------------------------------------------
          # NETWORK
          # IPv4 ONLY
          # --------------------------------------------------------

          cat > files/etc/config/network <<'EOF'
          config interface 'loopback'
            option device 'lo'
            option proto 'static'
            option ipaddr '127.0.0.1'
            option netmask '255.0.0.0'

          config device
            option name 'br-lan'
            option type 'bridge'
            list ports 'eth0'

          config interface 'lan'
            option device 'br-lan'
            option proto 'static'
            option ipaddr '192.168.1.1'
            option netmask '255.255.255.0'
          EOF

          # --------------------------------------------------------
          # WIRELESS
          # OTOMATIS AKTIF
          # OPEN SSID
          # --------------------------------------------------------

          cat > files/etc/config/wireless <<'EOF'
          config wifi-device 'radio0'
            option type 'mac80211'
            option path 'platform/ahb/18100000.wmac'
            option band '2g'
            option htmode 'HT20'
            option channel 'auto'
            option country 'ID'
            option disabled '0'

          config wifi-iface 'default_radio0'
            option device 'radio0'
            option mode 'ap'
            option network 'lan'
            option ssid 'MR3420-WiFi'
            option encryption 'none'
          EOF

          # --------------------------------------------------------
          # DHCP / DNS
          # IPv4
          # --------------------------------------------------------

          cat > files/etc/config/dhcp <<'EOF'
          config dnsmasq
            option domainneeded '1'
            option boguspriv '1'
            option filterwin2k '0'
            option localise_queries '1'
            option rebind_protection '1'
            option rebind_localhost '1'
            option local '/lan/'
            option domain 'lan'
            option expandhosts '1'
            option authoritative '1'
            option readethers '1'
            option leasefile '/tmp/dhcp.leases'
            option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

          config dhcp 'lan'
            option interface 'lan'
            option start '100'
            option limit '100'
            option leasetime '12h'
            option dhcpv6 'disabled'
            option ra 'disabled'
          EOF

          # --------------------------------------------------------
          # FIREWALL
          # IPv4 ONLY
          # --------------------------------------------------------

          cat > files/etc/config/firewall <<'EOF'
          config defaults
            option syn_flood '1'
            option input 'ACCEPT'
            option output 'ACCEPT'
            option forward 'REJECT'

          config zone
            option name 'lan'
            list network 'lan'
            option input 'ACCEPT'
            option output 'ACCEPT'
            option forward 'ACCEPT'

          config zone
            option name 'wan'
            list network 'wan'
            option input 'REJECT'
            option output 'ACCEPT'
            option forward 'REJECT'
            option masq '1'
            option mtu_fix '1'

          config forwarding
            option src 'lan'
            option dest 'wan'

          config rule
            option name 'Allow-DHCP'
            option src 'lan'
            option proto 'udp'
            option dest_port '67-68'
            option target 'ACCEPT'

          config rule
            option name 'Allow-DNS'
            option src 'lan'
            option proto 'tcp udp'
            option dest_port '53'
            option target 'ACCEPT'
          EOF

      # ============================================================
      # 7. OPENNDS DEFAULT CONFIG
      #
      # Kita arahkan openNDS ke bridge LAN.
      # Konfigurasi voucher/FAS akan dilakukan setelah sistem
      # dasar berhasil boot.
      # ============================================================

      - name: Create openNDS configuration
        run: |
          cd openwrt

          cat > files/etc/config/opennds <<'EOF'
          config opennds
            option enabled '1'
            option gatewayinterface 'br-lan'
          EOF

      # ============================================================
      # 8. REMOVE IPV6
      # ============================================================

      - name: Disable IPv6
        run: |
          cd openwrt

          mkdir -p files/etc/sysctl.d

          cat > files/etc/sysctl.d/99-no-ipv6.conf <<'EOF'
          net.ipv6.conf.all.disable_ipv6=1
          net.ipv6.conf.default.disable_ipv6=1
          net.ipv6.conf.lo.disable_ipv6=1
          EOF

      # ============================================================
      # 9. BUILD CONFIG
      # ============================================================

      - name: Create build configuration
        run: |
          cd openwrt

          cat > .config <<'EOF'
          # ========================================================
          # TARGET
          # ========================================================

          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          # ========================================================
          # FILESYSTEM
          # ========================================================

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          # ========================================================
          # IPV6 DISABLED
          # ========================================================

          # CONFIG_IPV6 is not set
          # CONFIG_PACKAGE_kmod-ipv6 is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_luci-proto-ipv6 is not set

          # ========================================================
          # WIFI
          # ========================================================

          CONFIG_PACKAGE_wpad-basic=y

          # ========================================================
          # USB
          # ========================================================

          CONFIG_PACKAGE_kmod-usb2=y

          # ========================================================
          # HUAWEI M150-2 / E3372
          # NCM
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_usb-modeswitch=y

          # ========================================================
          # DHCP / DNS
          # ========================================================

          CONFIG_PACKAGE_dnsmasq-full=y

          # ========================================================
          # OPENNDS
          # ========================================================

          CONFIG_PACKAGE_opennds=y

          # ========================================================
          # MINIMAL LUCI
          # ========================================================

          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-openwrt=y

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          EOF

          # ========================================================
          # GENERATE FINAL CONFIG
          # ========================================================

          make defconfig

          echo
          echo "=========================================="
          echo "FINAL TARGET"
          echo "=========================================="

          grep '^CONFIG_TARGET_ath79' .config

          echo
          echo "=========================================="
          echo "FINAL DEVICE"
          echo "=========================================="

          grep \
            '^CONFIG_TARGET_ath79_generic_DEVICE' \
            .config

      # ============================================================
      # 10. VERIFY IPV6
      # ============================================================

      - name: Verify IPv6 is disabled
        run: |
          cd openwrt

          echo "=========================================="
          echo "IPV6 CHECK"
          echo "=========================================="

          if grep -q '^CONFIG_IPV6=y' .config; then
            echo "ERROR: IPv6 is still enabled"
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_luci-proto-ipv6=y' .config; then
            echo "ERROR: LuCI IPv6 support is enabled"
            exit 1
          fi

          echo "IPv6 kernel support disabled."

      # ============================================================
      # 11. VERIFY OPENNDS
      # ============================================================

      - name: Verify openNDS
        run: |
          cd openwrt

          echo "=========================================="
          echo "OPENNDS CHECK"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_opennds' .config

          grep -R -n \
            'gatewayinterface' \
            files/etc/config/opennds

      # ============================================================
      # 12. VERIFY DTS
      # ============================================================

      - name: Verify 8MB DTS
        run: |
          cd openwrt

          DTS="target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts"

          echo "=========================================="
          echo "DTS 8MB CHECK"
          echo "=========================================="

          grep -A8 -B2 \
            'partition@20000' \
            "$DTS"

          echo
          echo "=========================================="
          echo "ART CHECK"
          echo "=========================================="

          grep -A6 -B2 \
            'partition@7f0000' \
            "$DTS"

          echo
          echo "=========================================="
          echo "8MLZMA CHECK"
          echo "=========================================="

          grep -R -n \
            'TPLINK_FLASHLAYOUT := 8Mlzma' \
            target/linux/ath79/image

      # ============================================================
      # 13. DOWNLOAD SOURCE PACKAGES
      # ============================================================

      - name: Download packages
        run: |
          cd openwrt

          make download -j4 V=s

      # ============================================================
      # 14. BUILD
      # ============================================================

      - name: Build firmware
        run: |
          cd openwrt

          make -j2 V=s

      # ============================================================
      # 15. SHOW FIRMWARE
      # ============================================================

      - name: Show firmware information
        run: |
          cd openwrt

          echo
          echo "=========================================="
          echo "FIR
```
