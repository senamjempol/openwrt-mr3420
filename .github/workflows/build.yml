name: Build OpenWrt 21.02 MR3420 v3 (8MB - Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt Source (v21.02)
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout openwrt-21.02

      - name: Patch tiny-tp-link.mk for 8MB MR3420 v3
        run: |
          cd openwrt
          FILE="target/linux/ath79/image/tiny-tp-link.mk"
          
          # Hapus definisi bawaan mr3420-v3 yang lama
          sed -i '/define Device\/tplink_tl-mr3420-v3/,/endef/d' "$FILE"
          sed -i '/TARGET_DEVICES += tplink_tl-mr3420-v3/d' "$FILE"
          
          # Tambahkan kembali konfigurasi 8MB menggunakan echo yang aman dari error editor
          echo "" >> "$FILE"
          echo "define Device/tplink_tl-mr3420-v3" >> "$FILE"
          echo "  \$(Device/tp-link-factory)" >> "$FILE"
          echo "  SOC := qca9531" >> "$FILE"
          echo "  DEVICE_MODEL := TL-MR3420" >> "$FILE"
          echo "  DEVICE_VARIANT := v3" >> "$FILE"
          echo "  TPLINK_HWID := 0x34200003" >> "$FILE"
          echo "  IMAGE_SIZE := 7936k" >> "$FILE"
          echo "  DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport" >> "$FILE"
          echo "endef" >> "$FILE"
          echo "TARGET_DEVICES += tplink_tl-mr3420-v3" >> "$FILE"
          
          echo "Successfully patched tiny-tp-link.mk with 8MB size!"

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration (.config)
        run: |
          cd openwrt
          
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_tiny=y" >> .config
          echo "CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y" >> .config
          
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_LUCI_LANG_id=y" >> .config
          
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-21.02-mr3420v3-8mb-tiny
          path: |
            openwrt/bin/targets/ath79/tiny/*factory*.bin
            openwrt/bin/targets/ath79/tiny/*sysupgrade*.bin
