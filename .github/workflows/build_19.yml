name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      OPENWRT_DIR: openwrt

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ca-certificates \
            python3 \
            python3-distutils


      # =========================================================
      # 3. PYTHON 2
      # =========================================================
      - name: Install Python 2.7
        run: |
          cd /tmp

          wget -q \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/opt/python2 \
            --enable-unicode=ucs4 \
            --without-ensurepip

          make -j$(nproc)

          sudo make install

          sudo ln -sf \
            /opt/python2/bin/python2.7 \
            /usr/local/bin/python

          sudo ln -sf \
            /opt/python2/bin/python2.7 \
            /usr/local/bin/python2

          echo "/opt/python2/bin" >> "$GITHUB_PATH"

          python --version


      # =========================================================
      # 4. CLONE OPENWRT
      # =========================================================
      - name: Clone OpenWrt 19.07.9
        run: |
          rm -rf openwrt

          git clone \
            --depth=1 \
            --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          test -f openwrt/Makefile


      # =========================================================
      # 5. CREATE DTS
      # =========================================================
      - name: Create TL-MR3420 v3 DTS
        run: |
          cat > openwrt/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts <<'EOF'
          /dts-v1/;

          #include "qca9533.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
              model = "TP-Link TL-MR3420 v3";

              aliases {
                  led-boot = &led_system;
                  led-failsafe = &led_system;
                  led-running = &led_system;
                  led-upgrade = &led_system;
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "green:system";
                      gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
                  };

                  usb {
                      label = "green:usb";
                      gpios = <&gpio 4 GPIO_ACTIVE_LOW>;
                  };

                  wps {
                      label = "green:wps";
                      gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      linux,code = <KEY_RESTART>;
                      gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };

                  wps {
                      label = "wps";
                      linux,code = <KEY_WPS_BUTTON>;
                      gpios = <&gpio 2 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };
              };
          };

          &spi {
              status = "okay";

              flash@0 {
                  compatible = "jedec,spi-nor";
                  reg = <0>;
                  spi-max-frequency = <25000000>;

                  partitions {
                      compatible = "fixed-partitions";
                      #address-cells = <1>;
                      #size-cells = <1>;

                      partition@0 {
                          label = "u-boot";
                          reg = <0x000000 0x020000>;
                          read-only;
                      };

                      firmware: partition@20000 {
                          label = "firmware";
                          reg = <0x020000 0x7d0000>;
                      };

                      art: partition@7f0000 {
                          label = "art";
                          reg = <0x7f0000 0x010000>;
                          read-only;
                      };
                  };
              };
          };

          &eth0 {
              status = "okay";
          };

          &eth1 {
              status = "okay";
          };

          &wmac {
              status = "okay";
              mtd-cal-data = <&art 0x1000>;
          };

          &usb {
              status = "okay";
          };

          &uart {
              status = "okay";
          };
          EOF


      # =========================================================
      # 6. ADD DEVICE
      # =========================================================
      - name: Add TL-MR3420 v3 device
        run: |
          cat >> openwrt/target/linux/ath79/image/tiny-tp-link.mk <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-4mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_DTS := qca9531_tplink_tl-mr3420-v3
            TPLINK_FLASHLAYOUT := 8Mlzma
            IMAGE_SIZE := 7936k
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += tl-mr3420-v3
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF


      # =========================================================
      # 7. FEEDS
      # =========================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # =========================================================
      # 8. CONFIG
      # =========================================================
      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_ath9k-firmware=y
          CONFIG_PACKAGE_wpad-basic=y

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y

          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF

          make defconfig


      # =========================================================
      # 9. PREREQUISITE
      # =========================================================
      - name: Check prerequisites
        working-directory: openwrt
        run: |
          python --version
          make prereq


      # =========================================================
      # 10. DOWNLOAD
      # =========================================================
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)


      # =========================================================
      # 11. BUILD
      # =========================================================
      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s


      # =========================================================
      # 12. INSPECT BIN/TARGETS
      # =========================================================
      - name: Inspect build output
        working-directory: openwrt
        run: |
          echo "======================================"
          echo "BIN/TARGETS SIZE"
          echo "======================================"

          du -sh bin/targets

          echo ""
          echo "======================================"
          echo "ALL FILES - SIZE SORTED"
          echo "======================================"

          find bin/targets \
            -type f \
            -printf "%s %p\n" \
            | sort -nr \
            | head -100 \
            | numfmt --field=1 --to=iec

          echo ""
          echo "======================================"
          echo "IMAGE-LIKE FILES"
          echo "======================================"

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec ls -lh {} \;


      # =========================================================
      # 13. FIND ACTUAL FIRMWARE
      # =========================================================
      - name: Find MR3420 firmware
        working-directory: openwrt
        run: |
          echo "======================================"
          echo "MR3420 FILES"
          echo "======================================"

          find bin/targets \
            -type f \
            | grep -i \
              -E 'mr3420|3420' \
            | while read FILE; do
                ls -lh "$FILE"
              done


      # =========================================================
      # 14. CREATE CLEAN FIRMWARE DIRECTORY
      # =========================================================
      - name: Prepare firmware
        run: |
          rm -rf firmware
          mkdir -p firmware

          echo "======================================"
          echo "SEARCHING FOR MR3420 FIRMWARE"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            \( \
              -name "*mr3420*.bin" \
              -o -name "*mr3420*.img" \
              -o -name "*mr3420*.img.gz" \
              -o -name "*mr3420*.itb" \
            \) \
            -print


      # =========================================================
      # 15. COPY ONLY MR3420 FILES
      # =========================================================
      - name: Copy MR3420 firmware
        run: |
          set -e

          FOUND=0

          while IFS= read -r FILE; do

            SIZE=$(stat -c%s "$FILE")

            echo ""
            echo "FILE:"
            echo "$FILE"

            echo "SIZE:"
            numfmt --to=iec "$SIZE"

            # 8 MB flash:
            # image firmware harus jauh di bawah 8 MB.
            if [ "$SIZE" -gt 8000000 ]; then
              echo "WARNING: file terlalu besar, dilewati."
              continue
            fi

            cp "$FILE" firmware/

            FOUND=1

          done < <(
            find openwrt/bin/targets \
              -type f \
              \( \
                -name "*mr3420*.bin" \
                -o -name "*mr3420*.img" \
                -o -name "*mr3420*.img.gz" \
                -o -name "*mr3420*.itb" \
              \)
          )

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "ERROR: Firmware MR3420 v3 tidak ditemukan."
            exit 1
          fi


      # =========================================================
      # 16. FINAL ARTIFACT CHECK
      # =========================================================
      - name: Final artifact check
        run: |
          echo "======================================"
          echo "FINAL FIRMWARE"
          echo "======================================"

          find firmware \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;

          echo ""
          echo "======================================"
          echo "TOTAL SIZE"
          echo "======================================"

          du -sh firmware

          echo ""
          echo "======================================"
          echo "TOTAL BYTES"
          echo "======================================"

          du -sb firmware


      # =========================================================
      # 17. GENERATE CHECKSUM
      # =========================================================
      - name: Generate SHA256
        run: |
          cd firmware

          sha256sum * > sha256sums.txt

          echo "======================================"
          cat sha256sums.txt


      # =========================================================
      # 18. UPLOAD ONLY FIRMWARE
      # =========================================================
      - name: Upload firmware ONLY
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-19.07.9-TL-MR3420-v3-8MB
          path: firmware/*
          if-no-files-found: error
          compression-level: 9
