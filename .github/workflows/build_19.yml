```yaml
name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout OpenWrt 19.07.9
        run: |
          git clone --depth 1 --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc \
            swig \
            time

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inspect OpenWrt 19.07.9
        working-directory: openwrt
        run: |
          echo "===== ATH79 ====="
          ls target/linux/ath79

          echo
          echo "===== IMAGE FILES ====="
          ls target/linux/ath79/image

          echo
          echo "===== TP-LINK DEFINITIONS ====="
          grep -R -n "define Device/tplink" \
            target/linux/ath79/image | head -50 || true

          echo
          echo "===== 8MLZMA ====="
          grep -R -n "8Mlzma" \
            target/linux/ath79/image || true

      - name: Create MR3420 v3 DTS
        working-directory: openwrt
        run: |
          cat > target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts <<'EOF'
          #include "qca953x.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
              model = "TP-Link TL-MR3420 v3";

              aliases {
                  led-boot = &led_system;
                  led-failsafe = &led_system;
                  led-running = &led_system;
                  led-upgrade = &led_system;
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "tl-mr3420-v3:green:system";
                      gpios = <&gpio 14 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      linux,code = <KEY_RESTART>;
                      gpios = <&gpio 3 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };

                  wps {
                      label = "wps";
                      linux,code = <KEY_WPS_BUTTON>;
                      gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };
              };
          };

          &spi {
              status = "okay";

              flash@0 {
                  compatible = "jedec,spi-nor";
                  reg = <0>;
                  spi-max-frequency = <25000000>;

                  partitions {
                      compatible = "fixed-partitions";
                      #address-cells = <1>;
                      #size-cells = <1>;

                      partition@0 {
                          label = "u-boot";
                          reg = <0x000000 0x020000>;
                          read-only;
                      };

                      partition@20000 {
                          compatible = "tplink,firmware";
                          label = "firmware";
                          reg = <0x020000 0x7d0000>;
                      };

                      partition@7f0000 {
                          label = "art";
                          reg = <0x7f0000 0x010000>;
                          read-only;
                      };
                  };
              };
          };

          &wmac {
              status = "okay";
          };

          &uart {
              status = "okay";
          };
          EOF

      - name: Create MR3420 v3 image definition
        working-directory: openwrt
        run: |
          cat >> target/linux/ath79/image/tiny-tp-link.mk <<'EOF'

          define Device/tplink_tl-mr3420-v3-8m
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_DTS := qca9531_tplink_tl-mr3420-v3
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3 8MB
            TPLINK_HWID := 0x34200003
            IMAGE_SIZE := 8000k
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3-8m
          EOF

      - name: Verify device definition
        working-directory: openwrt
        run: |
          echo "===== DEVICE ====="
          grep -R -n -A10 \
            "tplink_tl-mr3420-v3-8m" \
            target/linux/ath79/image

          echo
          echo "===== DTS ====="
          test -f \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          echo "DTS OK"

      - name: Configure build
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3-8m=y

          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-openwrt-2020=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          CONFIG_PACKAGE_opennds=y

          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_usb-modeswitch=y

          CONFIG_PACKAGE_odhcp6c=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n
          CONFIG_PACKAGE_luci-proto-ipv6=n
          EOF

          make defconfig

      - name: Verify final configuration
        working-directory: openwrt
        run: |
          echo "===== TARGET ====="
          grep "CONFIG_TARGET_.*DEVICE" .config || true

          echo
          echo "===== DNSMASQ ====="
          grep -E \
            "^CONFIG_PACKAGE_(dnsmasq|dnsmasq-full)=" \
            .config || true

          echo
          echo "===== OPENNDS ====="
          grep "^CONFIG_PACKAGE_opennds=" .config || true

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j2

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      - name: List firmware
        working-directory: openwrt
        run: |
          echo "===== FIRMWARE ====="
          find bin/targets/ath79/generic \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "===== SIZE ====="

          for file in bin/targets/ath79/generic/*.bin; do
            if [ -f "$file" ]; then
              stat -c "%n : %s bytes" "$file"
            fi
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-mr3420-v3-8mb
          path: |
            openwrt/bin/targets/ath79/generic/*
          if-no-files-found: error
```
