name: Build OpenWrt 19.07.9 - TP-Link TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules

          sudo docker system prune -af || true
          sudo apt-get clean

          echo "=== Disk after cleanup ==="
          df -h


      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            file \
            time \
            xsltproc \
            swig \
            libelf-dev \
            libz-dev \
            subversion \
            quilt


      - name: Install Python 2.7.18
        run: |
          cd /tmp

          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/opt/python2 \
            --disable-shared \
            --without-ensurepip

          make -j2
          sudo make install

          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python

          python --version


      - name: Clone OpenWrt 19.07.9
        run: |
          git clone \
            --depth=1 \
            --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git

          cd openwrt

          echo "=== OpenWrt version ==="
          git describe --tags --always


      - name: Add official TL-MR3420 v3 support
        working-directory: openwrt
        run: |
          MR3420_COMMIT=bf9b742cd4b47175e76aa42ce394fa8b507e9366

          git fetch \
            --no-tags \
            https://github.com/openwrt/openwrt.git \
            ${MR3420_COMMIT}

          echo "=== Applying official MR3420 v3 support ==="

          git show \
            --format= \
            --binary \
            ${MR3420_COMMIT} \
            -- \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts \
            target/linux/ath79/image/tiny-tp-link.mk \
            target/linux/ath79/tiny/base-files/etc/board.d/01_leds \
            target/linux/ath79/tiny/base-files/etc/board.d/02_network \
            > /tmp/mr3420.patch

          git apply /tmp/mr3420.patch

          echo "=== MR3420 files ==="

          ls -l \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts \
            target/linux/ath79/image/tiny-tp-link.mk \
            target/linux/ath79/tiny/base-files/etc/board.d/01_leds \
            target/linux/ath79/tiny/base-files/etc/board.d/02_network


      - name: Convert TL-MR3420 v3 to 8MB flash
        working-directory: openwrt
        run: |
          echo "=== Original device definition ==="

          grep -A12 -B2 \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk


          echo "=== Change 4MB layout to 8MB layout ==="

          sed -i \
            '/define Device\/tplink_tl-mr3420-v3/,/endef/ s/\$(Device\/tplink-4mlzma)/\$(Device\/tplink-8mlzma)/' \
            target/linux/ath79/image/tiny-tp-link.mk


          echo "=== Change 8MB IMAGE_SIZE to 8000k ==="

          sed -i \
            '/define Device\/tplink-8mlzma/,/endef/ s/IMAGE_SIZE := 7936k/IMAGE_SIZE := 8000k/' \
            target/linux/ath79/image/common-tp-link.mk


          echo "=== Change DTS firmware partition ==="

          sed -i \
            's/reg = <0x020000 0x3d0000>/reg = <0x020000 0x7d0000>/' \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


          echo "=== Change DTS ART partition ==="

          sed -i \
            's/reg = <0x3f0000 0x010000>/reg = <0x7f0000 0x010000>/' \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


          echo "=== Verify device definition ==="

          grep -A12 -B2 \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk


          echo "=== Verify 8MB definition ==="

          grep -A6 \
            "define Device/tplink-8mlzma" \
            target/linux/ath79/image/common-tp-link.mk


          echo "=== Verify DTS partitions ==="

          grep -n \
            -E "0x020000|0x7d0000|0x7f0000" \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Create OpenWrt configuration
        working-directory: openwrt
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_ath79=y' \
            'CONFIG_TARGET_ath79_tiny=y' \
            'CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y' \
            'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_luci-ssl=y' \
            'CONFIG_PACKAGE_kmod-ath9k=y' \
            'CONFIG_PACKAGE_wpad-mini=y' \
            'CONFIG_PACKAGE_kmod-usb2=y' \
            'CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y' \
            > .config

          echo "=== Initial .config ==="
          cat .config


      - name: Run defconfig
        working-directory: openwrt
        run: |
          make defconfig


      - name: Verify final configuration
        working-directory: openwrt
        run: |
          echo "=== Target configuration ==="

          grep \
            -E \
            'CONFIG_TARGET_ath79|CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3|CONFIG_TARGET_ROOTFS' \
            .config


          echo "=== Selected packages ==="

          grep \
            -E \
            'CONFIG_PACKAGE_(luci|luci-ssl|kmod-ath9k|wpad-mini|kmod-usb2|kmod-usb-ledtrig-usbport)' \
            .config


          echo "=== Verify MR3420 target exists ==="

          grep \
            -R \
            -n \
            "tplink_tl_mr3420_v3" \
            tmp/info 2>/dev/null || true


          echo "=== Check target selection ==="

          if ! grep -q \
            '^CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y' \
            .config; then

            echo "ERROR: TL-MR3420 v3 target was NOT selected."

            exit 1
          fi


      - name: Check OpenWrt prerequisites
        working-directory: openwrt
        run: |
          make prereq


      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j4 V=s


      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          echo "=== Starting build ==="

          make -j$(nproc) V=s


      - name: Locate MR3420 firmware
        working-directory: openwrt
        run: |
          echo "=== Searching firmware ==="

          find bin/targets/ath79/tiny \
            -type f \
            -iname '*mr3420*' \
            -print


      - name: Prepare firmware artifact
        working-directory: openwrt
        run: |
          rm -rf firmware
          mkdir -p firmware

          find bin/targets/ath79/tiny \
            -type f \
            \( \
              -iname '*mr3420*.bin' \
              -o \
              -iname '*mr3420*.img' \
              -o \
              -iname '*mr3420*.img.gz' \
            \) \
            -exec cp {} firmware/ \;


          echo "=== Firmware files ==="

          ls -lh firmware


          COUNT=$(find firmware -type f | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No MR3420 firmware was generated."
            exit 1
          fi


      - name: Validate firmware size
        working-directory: openwrt
        run: |
          echo "=== Firmware size ==="

          du -h firmware/*


          for FILE in firmware/*; do
            SIZE=$(stat -c%s "$FILE")

            echo "$FILE = $SIZE bytes"

            if [ "$SIZE" -gt 8388608 ]; then
              echo "ERROR: Firmware is larger than 8MB flash."
              exit 1
            fi
          done


      - name: Show firmware information
        working-directory: openwrt
        run: |
          echo "=== Firmware information ==="

          for FILE in firmware/*; do
            echo
            echo "----------------------------------------"
            echo "$FILE"
            echo "----------------------------------------"

            file "$FILE"

            ls -lh "$FILE"
          done


      - name: Generate SHA256
        working-directory: openwrt
        run: |
          sha256sum firmware/* \
            | tee firmware/SHA256SUMS


      - name: Upload only MR3420 firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-tl-mr3420-v3-8mb
          path: openwrt/firmware/
          if-no-files-found: error
          retention-days: 30
