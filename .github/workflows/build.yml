name: Build OpenWrt 21.02 MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Clone OpenWrt 21.02
        run: |
          git clone \
            --branch openwrt-21.02 \
            --single-branch \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Patch MR3420 v3 8MB
        run: |
          cd openwrt

          TINY="target/linux/ath79/image/tiny-tp-link.mk"
          GENERIC="target/linux/ath79/image/generic-tp-link.mk"
          DTS="target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts"

          echo "======================================"
          echo "PATCH DTS 8MB"
          echo "======================================"

          sed -i \
            's/reg = <0x020000 0x3d0000>/reg = <0x020000 0x7d0000>/' \
            "$DTS"

          sed -i \
            's/partition@3f0000/partition@7f0000/' \
            "$DTS"

          sed -i \
            's/reg = <0x3f0000 0x010000>/reg = <0x7f0000 0x010000>/' \
            "$DTS"

          echo "DTS after patch:"
          grep -n -A22 "partitions" "$DTS"


          echo "======================================"
          echo "REMOVE MR3420 FROM TINY"
          echo "======================================"

          sed -i \
            '/define Device\/tplink_tl-mr3420-v3/,/endef/d' \
            "$TINY"

          sed -i \
            '/TARGET_DEVICES += tplink_tl-mr3420-v3/d' \
            "$TINY"


          echo "======================================"
          echo "ADD MR3420 TO GENERIC"
          echo "======================================"

          cat >> "$GENERIC" <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += tl-mr3420-v3
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF


          echo "======================================"
          echo "CHECK 8MLZMA"
          echo "======================================"

          grep -n -A5 \
            "define Device/tplink-8mlzma" \
            target/linux/ath79/image/common-tp-link.mk


          echo "======================================"
          echo "CHECK MR3420"
          echo "======================================"

          grep -n -A12 \
            "define Device/tplink_tl-mr3420-v3" \
            "$GENERIC"


      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Configure
        run: |
          cd openwrt

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          # Small 8MB image: IPv4 only, no IPv6 stack/packages
          # CONFIG_IPV6 is not set

          # Minimal LuCI
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-darkmatter=y
          CONFIG_PACKAGE_luci-lib-base=y
          CONFIG_PACKAGE_luci-lib-ip=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_libiwinfo-lua=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          # USB modem: 3G/serial + QMI + USB Ethernet/RNDIS
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_wwan=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usb-modeswitch-data=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_luci-proto-ncm=y

          # Keep IPv4 firewall/NAT for normal routing and future openNDS use.
          # openNDS itself is intentionally NOT installed.
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_iptables=y

          # Indonesian LuCI translation
          CONFIG_LUCI_LANG_id=y
          EOF

          make defconfig

          echo "======================================"
          echo "FINAL PACKAGE SELECTION"
          echo "======================================"
          ./scripts/diffconfig.sh | grep -E '^(CONFIG_PACKAGE_|# CONFIG_IPV6)' || true


      - name: Verify Target
        run: |
          cd openwrt

          echo "======================================"
          echo "TARGET"
          echo "======================================"

          grep "^CONFIG_TARGET_ath79" .config

          echo "======================================"
          echo "MR3420"
          echo "======================================"

          grep \
            "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3" \
            .config

          echo "======================================"
          echo "DTS PARTITION"
          echo "======================================"

          grep -n -A25 \
            "partitions" \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


      - name: Download
        run: |
          cd openwrt
          make download -j2


      - name: Build
        run: |
          cd openwrt
          make -j2 V=s


      - name: Show Firmware
        run: |
          cd openwrt

          echo "======================================"
          echo "FIRMWARE"
          echo "======================================"

          ls -lh \
            bin/targets/ath79/generic/


      - name: Check Firmware Size
        run: |
          cd openwrt

          echo "======================================"
          echo "BIN SIZE"
          echo "======================================"

          ls -lh \
            bin/targets/ath79/generic/*.bin


      - name: Upload Firmware
        uses: actions/upload-artifact@v4

        with:
          name: openwrt-21.02-mr3420-v3-8mb

          path: |
            openwrt/bin/targets/ath79/generic/*.bin
            openwrt/bin/targets/ath79/generic/sha256sums
