name: Build OpenWrt 19.07.9 MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python2 \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone OpenWrt 19.07.9
        run: |
          git clone \
            --branch v19.07.9 \
            --single-branch \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Add & Patch MR3420 v3 8MB for 19.07.9
        run: |
          cd openwrt

          DTS_PATH="target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts"
          GENERIC="target/linux/ath79/image/generic-tp-link.mk"
          DTS_MAKEFILE="target/linux/ath79/dts/Makefile"

          echo "======================================"
          echo "DOWNLOAD DTS FROM 21.02 REPO"
          echo "======================================"
          curl -o "$DTS_PATH" \
            https://raw.githubusercontent.com/openwrt/openwrt/openwrt-21.02/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          echo "======================================"
          echo "REGISTER DTB IN DTS MAKEFILE"
          echo "======================================"
          echo "dtb-\$(CONFIG_TARGET_ath79_generic) += qca9531_tplink_tl-mr3420-v3.dtb" >> "$DTS_MAKEFILE"

          echo "======================================"
          echo "PATCH DTS FOR 8MB FLASH"
          echo "======================================"
          sed -i \
            's/reg = <0x020000 0x3d0000>/reg = <0x020000 0x7d0000>/' \
            "$DTS_PATH"

          sed -i \
            's/partition@3f0000/partition@7f0000/' \
            "$DTS_PATH"

          sed -i \
            's/reg = <0x3f0000 0x010000>/reg = <0x7f0000 0x010000>/' \
            "$DTS_PATH"

          echo "DTS after patch:"
          grep -n -A22 "partitions" "$DTS_PATH"


          echo "======================================"
          echo "ADD MR3420 TO GENERIC"
          echo "======================================"

          cat >> "$GENERIC" <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += tl-mr3420-v3
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF


          echo "======================================"
          echo "CHECK MR3420 DEFINITION"
          echo "======================================"

          grep -n -A12 \
            "define Device/tplink_tl-mr3420-v3" \
            "$GENERIC"


      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Configure
        run: |
          cd openwrt

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_id=y
          EOF

          make defconfig


      - name: Verify Target
        run: |
          cd openwrt

          echo "======================================"
          echo "TARGET"
          echo "======================================"

          grep "^CONFIG_TARGET_ath79" .config

          echo "======================================"
          echo "MR3420"
          echo "======================================"

          grep \
            "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3" \
            .config

          echo "======================================"
          echo "DTS PARTITION"
          echo "======================================"

          grep -n -A25 \
            "partitions" \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


      - name: Download
        run: |
          cd openwrt
          make download -j2


      - name: Build
        run: |
          cd openwrt
          make -j2 V=s


      - name: Show Firmware
        run: |
          cd openwrt

          echo "======================================"
          echo "FIRMWARE"
          echo "======================================"

          ls -lh \
            bin/targets/ath79/generic/


      - name: Check Firmware Size
        run: |
          cd openwrt

          echo "======================================"
          echo "BIN SIZE"
          echo "======================================"

          ls -lh \
            bin/targets/ath79/generic/*.bin


      - name: Upload Firmware
        uses: actions/upload-artifact@v4

        with:
          name: openwrt-19.07.9-mr3420-v3-8mb

          path: |
            openwrt/bin/targets/ath79/generic/*.bin
            openwrt/bin/targets/ath79/generic/sha256sums
