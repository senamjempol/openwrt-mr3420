name: Build OpenWrt 21.02 MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl

      - name: Clone OpenWrt 21.02
        run: |
          git clone --branch openwrt-21.02 --single-branch https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git describe --tags --always

      - name: Check OpenWrt Source
        run: |
          cd openwrt

          echo "======================================"
          echo "CHECK SOURCE"
          echo "======================================"

          test -f target/linux/ath79/image/Makefile
          test -f target/linux/ath79/image/common-tp-link.mk
          test -f target/linux/ath79/image/tiny-tp-link.mk
          test -f target/linux/ath79/image/generic-tp-link.mk

          echo "OpenWrt source OK"

      - name: Move MR3420 v3 to Generic
        run: |
          cd openwrt

          TINY="target/linux/ath79/image/tiny-tp-link.mk"
          GENERIC="target/linux/ath79/image/generic-tp-link.mk"

          echo "======================================"
          echo "ORIGINAL MR3420 DEFINITION"
          echo "======================================"

          grep -n -A12 -B2 "tplink_tl-mr3420-v3" "$TINY" || true

          echo "======================================"
          echo "REMOVE FROM TINY"
          echo "======================================"

          sed -i '/define Device\/tplink_tl-mr3420-v3/,/endef/d' "$TINY"
          sed -i '/TARGET_DEVICES += tplink_tl-mr3420-v3/d' "$TINY"

          echo "======================================"
          echo "ADD TO GENERIC"
          echo "======================================"

          printf '%s\n' \
            '' \
            '# TP-Link TL-MR3420 v3 - 8MB' \
            '' \
            'define Device/tplink_tl-mr3420-v3' \
            '  $(Device/tplink-8mlzma)' \
            '  SOC := qca9531' \
            '  DEVICE_MODEL := TL-MR3420' \
            '  DEVICE_VARIANT := v3' \
            '  TPLINK_HWID := 0x34200003' \
            '  DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport' \
            'endef' \
            '' \
            'TARGET_DEVICES += tplink_tl-mr3420-v3' \
            '' >> "$GENERIC"

          echo "======================================"
          echo "NEW MR3420 DEFINITION"
          echo "======================================"

          grep -n -A12 -B2 "tplink_tl-mr3420-v3" "$GENERIC"

      - name: Check 8MB Layout
        run: |
          cd openwrt

          echo "======================================"
          echo "8MLZMA CHECK"
          echo "======================================"

          grep -n -A8 -B2 "define Device/tplink-8mlzma" \
            target/linux/ath79/image/common-tp-link.mk

          echo "======================================"
          echo "FLASH LAYOUT"
          echo "======================================"

          grep -n "TPLINK_FLASHLAYOUT := 8Mlzma" \
            target/linux/ath79/image/common-tp-link.mk

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt
        run: |
          cd openwrt

          echo "======================================"
          echo "CREATE CONFIG"
          echo "======================================"

          rm -f .config

          printf '%s\n' \
            'CONFIG_TARGET_ath79=y' \
            'CONFIG_TARGET_ath79_generic=y' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_LUCI_LANG_id=y' \
            > .config

          make defconfig

      - name: Verify Configuration
        run: |
          cd openwrt

          echo "======================================"
          echo "FINAL CONFIG"
          echo "======================================"

          grep '^CONFIG_TARGET_' .config || true

          echo "======================================"
          echo "MR3420 DEVICE"
          echo "======================================"

          grep -R -n "tplink_tl-mr3420-v3" \
            target/linux/ath79/image

          echo "======================================"
          echo "CARAMBOLA CHECK"
          echo "======================================"

          if grep -qi "carambola2" .config; then
            echo "ERROR: CARAMBOLA2 TERPILIH"
            exit 1
          fi

          echo "OK: CARAMBOLA2 TIDAK TERPILIH"

      - name: Download Sources
        run: |
          cd openwrt
          make download -j2

      - name: Build Firmware
        run: |
          cd openwrt
          make -j2 V=s

      - name: List Firmware
        run: |
          cd openwrt

          echo "======================================"
          echo "FIRMWARE RESULT"
          echo "======================================"

          find bin/targets/ath79/generic \
            -maxdepth 1 \
            -type f \
            -name "*.bin" \
            -printf "%f\n" \
            | sort

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-21.02-mr3420-v3-8mb
          path: |
            openwrt/bin/targets/ath79/generic/*.bin
            openwrt/bin/targets/ath79/generic/sha256sums
