name: Build OpenWrt 19.07.9 - TL-MR3420 v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            python3


      # =========================================================
      # 3. CLONE OPENWRT 19.07.9
      # =========================================================
      - name: Clone OpenWrt 19.07.9
        run: |
          git clone \
            --branch v19.07.9 \
            --depth 1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "=== OpenWrt directory ==="
          ls -lah openwrt

          echo "=== Makefile ==="
          ls -lh openwrt/Makefile


      # =========================================================
      # 4. COPY CUSTOM DTS
      # =========================================================
      - name: Install TL-MR3420 v3 DTS
        run: |
          mkdir -p openwrt/target/linux/ath79/dts

          cp \
            custom/qca9531_tplink_tl-mr3420-v3.dts \
            openwrt/target/linux/ath79/dts/

          echo "=== DTS ==="
          grep -n "tl-mr3420-v3" \
            openwrt/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


      # =========================================================
      # 5. COPY CUSTOM DEVICE DEFINITION
      # =========================================================
      - name: Install TL-MR3420 v3 image definition
        run: |
          mkdir -p openwrt/target/linux/ath79/image

          cp \
            custom/tiny-tp-link.mk \
            openwrt/target/linux/ath79/image/

          echo "=== Device definition ==="
          grep -n -A12 -B3 \
            "tplink_tl-mr3420-v3" \
            openwrt/target/linux/ath79/image/tiny-tp-link.mk


      # =========================================================
      # 6. UPDATE FEEDS
      # =========================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # =========================================================
      # 7. CREATE CONFIGURATION
      # =========================================================
      - name: Create OpenWrt configuration
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024

          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_ath9k-firmware=y
          CONFIG_PACKAGE_wpad-basic=y

          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          # LuCI
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          EOF

          echo "=== Initial .config ==="
          cat .config


      # =========================================================
      # 8. DEFCONFIG
      # =========================================================
      - name: Generate final configuration
        working-directory: openwrt
        run: |
          make defconfig

          echo "=== Target ==="
          grep "^CONFIG_TARGET" .config

          echo "=== Device ==="
          grep "MR3420" .config || true


      # =========================================================
      # 9. VERIFY MAKEFILE AND TARGET
      # =========================================================
      - name: Verify target
        working-directory: openwrt
        run: |
          echo "======================================"
          echo "Current directory"
          echo "======================================"
          pwd

          echo "======================================"
          echo "Makefile"
          echo "======================================"
          ls -lh Makefile

          echo "======================================"
          echo "MR3420 DTS"
          echo "======================================"
          test -f target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          echo "======================================"
          echo "MR3420 image definition"
          echo "======================================"
          grep -n \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk

          echo "======================================"
          echo "Device config"
          echo "======================================"
          grep \
            "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3" \
            .config


      # =========================================================
      # 10. DOWNLOAD SOURCE PACKAGES
      # =========================================================
      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)


      # =========================================================
      # 11. BUILD
      # =========================================================
      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          echo "======================================"
          echo "START BUILD"
          echo "======================================"

          make -j$(nproc) V=s


      # =========================================================
      # 12. SHOW BUILD RESULT
      # =========================================================
      - name: Show firmware result
        working-directory: openwrt
        run: |
          echo "======================================"
          echo "BUILD RESULT"
          echo "======================================"

          find bin/targets -type f -printf \
            "%p  %k KB\n"

          echo ""
          echo "======================================"
          echo "BIN FILES"
          echo "======================================"

          find bin/targets -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec ls -lh {} \;


      # =========================================================
      # 13. COPY ONLY FIRMWARE
      # =========================================================
      - name: Prepare firmware artifact
        working-directory: openwrt
        run: |
          mkdir -p ../firmware

          find bin/targets -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec cp {} ../firmware/ \;

          echo "======================================"
          echo "FILES TO UPLOAD"
          echo "======================================"

          ls -lah ../firmware


      # =========================================================
      # 14. CREATE CHECKSUM
      # =========================================================
      - name: Generate SHA256
        run: |
          cd firmware

          sha256sum * > sha256sums.txt

          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat sha256sums.txt


      # =========================================================
      # 15. UPLOAD FIRMWARE ONLY
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-19.07.9-TL-MR3420-v3
          path: firmware/*
          if-no-files-found: error
          compression-level: 9
