name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            python3


      # =========================================================
      # 3. DOWNLOAD OPENWRT 19.07.9
      # =========================================================
      - name: Clone OpenWrt 19.07.9
        run: |
          git clone \
            --branch v19.07.9 \
            --depth 1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "OpenWrt berhasil di-download"

          test -f openwrt/Makefile

          echo "Makefile ditemukan:"
          ls -lh openwrt/Makefile


      # =========================================================
      # 4. CREATE MR3420 V3 DTS
      # =========================================================
      - name: Create TL-MR3420 v3 DTS
        run: |
          cat > openwrt/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts <<'EOF'
          /dts-v1/;

          #include "qca953x.dtsi"

          #include <dt-bindings/gpio/gpio.h>

          / {
              compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
              model = "TP-Link TL-MR3420 v3";

              aliases {
                  led-boot = &led_system;
                  led-failsafe = &led_system;
                  led-running = &led_system;
                  led-upgrade = &led_system;
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "tp-link:green:system";
                      gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
                  };

                  usb {
                      label = "tp-link:green:usb";
                      gpios = <&gpio 4 GPIO_ACTIVE_LOW>;
                  };

                  wps {
                      label = "tp-link:green:wps";
                      gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      linux,code = <KEY_RESTART>;
                      gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };

                  wps {
                      label = "wps";
                      linux,code = <KEY_WPS_BUTTON>;
                      gpios = <&gpio 2 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };
              };
          };

          &spi {
              status = "okay";

              flash@0 {
                  compatible = "jedec,spi-nor";
                  reg = <0>;
                  spi-max-frequency = <25000000>;

                  partitions {
                      compatible = "fixed-partitions";
                      #address-cells = <1>;
                      #size-cells = <1>;

                      partition@0 {
                          label = "u-boot";
                          reg = <0x000000 0x020000>;
                          read-only;
                      };

                      partition@20000 {
                          label = "firmware";
                          reg = <0x020000 0x7d0000>;
                      };

                      partition@7f0000 {
                          label = "art";
                          reg = <0x7f0000 0x010000>;
                          read-only;
                      };
                  };
              };
          };

          &eth0 {
              status = "okay";

              phy-mode = "gmii";

              mtd-mac-address = <&art 0x0>;

              gmac-config {
                  device_type = "network";
              };
          };

          &eth1 {
              status = "okay";

              phy-mode = "gmii";

              mtd-mac-address = <&art 0x0>;
          };

          &wmac {
              status = "okay";

              mtd-cal-data = <&art 0x1000>;
          };

          &usb {
              status = "okay";
          };

          &uart {
              status = "okay";
          };
          EOF

          echo "=== DTS dibuat ==="
          ls -lh openwrt/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


      # =========================================================
      # 5. ADD DEVICE TO TINY TP-LINK
      # =========================================================
      - name: Add TL-MR3420 v3 device definition
        run: |
          cat >> openwrt/target/linux/ath79/image/tiny-tp-link.mk <<'EOF'

          define Device/tplink_tl-mr3420-v3
            ATH_SOC := qca9531
            DEVICE_TITLE := TP-Link TL-MR3420 v3
            DEVICE_DTS := qca9531_tplink_tl-mr3420-v3
            TPLINK_FLASHLAYOUT := 8Mlzma
            IMAGE_SIZE := 7936k
            SUPPORTED_DEVICES := tl-mr3420-v3
          endef
          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF

          echo "=== Device definition ==="

          grep -n -A10 -B2 \
            "tplink_tl-mr3420-v3" \
            openwrt/target/linux/ath79/image/tiny-tp-link.mk


      # =========================================================
      # 6. UPDATE FEEDS
      # =========================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # =========================================================
      # 7. CONFIGURE
      # =========================================================
      - name: Configure OpenWrt
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_ath9k-firmware=y
          CONFIG_PACKAGE_wpad-basic=y

          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF

          make defconfig

          echo ""
          echo "======================================"
          echo "TARGET CONFIGURATION"
          echo "======================================"

          grep "^CONFIG_TARGET" .config

          echo ""
          echo "======================================"
          echo "MR3420 CONFIG"
          echo "======================================"

          grep "mr3420" .config || true


      # =========================================================
      # 8. VERIFY SOURCE
      # =========================================================
      - name: Verify MR3420 files
        working-directory: openwrt
        run: |

          echo "======================================"
          echo "MAKEFILE"
          echo "======================================"

          test -f Makefile
          ls -lh Makefile


          echo ""
          echo "======================================"
          echo "DTS"
          echo "======================================"

          test -f \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          grep \
            'tplink,tl-mr3420-v3' \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


          echo ""
          echo "======================================"
          echo "DEVICE DEFINITION"
          echo "======================================"

          grep -n \
            "tplink_tl_mr3420_v3" \
            target/linux/ath79/image/tiny-tp-link.mk


      # =========================================================
      # 9. DOWNLOAD SOURCES
      # =========================================================
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)


      # =========================================================
      # 10. BUILD
      # =========================================================
      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          echo "======================================"
          echo "BUILD START"
          echo "======================================"

          make -j$(nproc) V=s


      # =========================================================
      # 11. SHOW RESULT
      # =========================================================
      - name: Show build result
        working-directory: openwrt
        run: |

          echo "======================================"
          echo "BUILD RESULT"
          echo "======================================"

          find bin/targets \
            -type f \
            -printf "%p  %k KB\n"


          echo ""
          echo "======================================"
          echo "FIRMWARE FILES"
          echo "======================================"

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec ls -lh {} \;


      # =========================================================
      # 12. COPY ONLY FIRMWARE
      # =========================================================
      - name: Prepare firmware
        working-directory: openwrt
        run: |

          mkdir -p ../firmware

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec cp {} ../firmware/ \;

          echo "======================================"
          echo "FILES FOR ARTIFACT"
          echo "======================================"

          ls -lah ../firmware


      # =========================================================
      # 13. SHA256
      # =========================================================
      - name: Generate SHA256
        run: |

          cd firmware

          sha256sum * > sha256sums.txt

          cat sha256sums.txt


      # =========================================================
      # 14. UPLOAD ONLY FIRMWARE
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-19.07.9-TL-MR3420-v3-8MB
          path: firmware/*
          if-no-files-found: error
          compression-level: 9
