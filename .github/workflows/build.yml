name: Build OpenWrt 21.02 MR3420 v3 (8MB - Generic Subtarget)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt Source (v21.02)
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout openwrt-21.02

      - name: Patch tp-link.mk for 8MB Flash (Generic Subtarget)
        run: |
          cd openwrt
          FILE="target/linux/ath79/image/tp-link.mk"
          
          # Mengubah tplink-4mlzma menjadi tplink-8mlzma untuk mr3420-v3 di file tp-link.mk
          sed -i '/define Device\/tplink_tl-mr3420-v3/,/endef/ s/\$(Device\/tplink-4mlzma)/\$(Device\/tplink-8mlzma)\n  IMAGE_SIZE := 7936k/' "$FILE"
          
          echo "Successfully patched tp-link.mk for 8MB!"

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration (.config)
        run: |
          cd openwrt
          
          # Menggunakan subtarget GENERIC di mana makro 8MB didukung penuh
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_DEVICE_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y" >> .config
          
          # Sertakan LuCI dan Bahasa Indonesia
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_LUCI_LANG_id=y" >> .config
          
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-21.02-mr3420v3-8mb-generic
          path: |
            openwrt/bin/targets/ath79/generic/*factory*.bin
            openwrt/bin/targets/ath79/generic/*sysupgrade*.bin
