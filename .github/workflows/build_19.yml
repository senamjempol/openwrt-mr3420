name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true

          sudo docker system prune -af || true
          sudo apt-get clean || true

          echo "=== Disk after cleanup ==="
          df -h


      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y build-essential
          sudo apt-get install -y clang
          sudo apt-get install -y flex
          sudo apt-get install -y bison
          sudo apt-get install -y g++
          sudo apt-get install -y gawk
          sudo apt-get install -y gcc-multilib
          sudo apt-get install -y g++-multilib
          sudo apt-get install -y gettext
          sudo apt-get install -y git
          sudo apt-get install -y libncurses5-dev
          sudo apt-get install -y libssl-dev
          sudo apt-get install -y python3
          sudo apt-get install -y python3-distutils
          sudo apt-get install -y rsync
          sudo apt-get install -y unzip
          sudo apt-get install -y wget
          sudo apt-get install -y zlib1g-dev
          sudo apt-get install -y file
          sudo apt-get install -y time
          sudo apt-get install -y xsltproc
          sudo apt-get install -y swig
          sudo apt-get install -y libelf-dev
          sudo apt-get install -y libz-dev
          sudo apt-get install -y subversion
          sudo apt-get install -y quilt


      - name: Install Python 2.7.18
        run: |
          cd /tmp

          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure --prefix=/opt/python2 --disable-shared --without-ensurepip

          make -j2

          sudo make install

          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python

          python --version


      - name: Clone OpenWrt 19.07.9
        run: |
          git clone --depth=1 --branch v19.07.9 https://github.com/openwrt/openwrt.git openwrt

          cd openwrt

          git describe --tags --always


      - name: Get official MR3420 v3 DTS
        working-directory: openwrt
        run: |
          MR3420_COMMIT=bf9b742cd4b47175e76aa42ce394fa8b507e9366

          git fetch --no-tags https://github.com/openwrt/openwrt.git ${MR3420_COMMIT}

          mkdir -p target/linux/ath79/dts

          git show ${MR3420_COMMIT}:target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts > target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          echo "=== DTS created ==="

          ls -lh target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          grep -n "compatible" target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          grep -n "model" target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


      - name: Add MR3420 v3 device
        working-directory: openwrt
        run: |
          printf '%s\n' '' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' 'define Device/tplink_tl-mr3420-v3' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' '  $(Device/tplink-4mlzma)' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' '  SOC := qca9531' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' '  DEVICE_MODEL := TL-MR3420' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' '  DEVICE_VARIANT := v3' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' '  TPLINK_HWID := 0x34200003' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' '  DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' 'endef' >> target/linux/ath79/image/tiny-tp-link.mk
          printf '%s\n' 'TARGET_DEVICES += tplink_tl-mr3420-v3' >> target/linux/ath79/image/tiny-tp-link.mk

          echo "=== MR3420 v3 definition ==="

          grep -A10 "define Device/tplink_tl-mr3420-v3" target/linux/ath79/image/tiny-tp-link.mk


      - name: Convert MR3420 v3 to 8MB
        working-directory: openwrt
        run: |
          echo "=== Check 8MB layout ==="

          grep -R -n -A8 "define Device/tplink-8mlzma" target/linux/ath79/image || true

          echo "=== Change MR3420 from 4MB to 8MB ==="

          python - <<'PY'
          from pathlib import Path

          p = Path("target/linux/ath79/image/tiny-tp-link.mk")

          text = p.read_text()

          old = "$(Device/tplink-4mlzma)"
          new = "$(Device/tplink-8mlzma)"

          start = text.find("define Device/tplink_tl-mr3420-v3")
          end = text.find("endef", start)

          if start == -1:
              raise SystemExit("MR3420 v3 definition not found")

          if end == -1:
              raise SystemExit("MR3420 v3 endef not found")

          block = text[start:end]

          if old not in block:
              raise SystemExit("tplink-4mlzma not found in MR3420 block")

          block = block.replace(old, new)

          text = text[:start] + block + text[end:]

          p.write_text(text)
          PY

          echo "=== Change DTS partitions ==="

          python - <<'PY'
          from pathlib import Path

          p = Path("target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts")

          text = p.read_text()

          text = text.replace(
              "reg = <0x020000 0x3d0000>;",
              "reg = <0x020000 0x7d0000>;"
          )

          text = text.replace(
              "partition@3f0000",
              "partition@7f0000"
          )

          text = text.replace(
              "reg = <0x3f0000 0x010000>;",
              "reg = <0x7f0000 0x010000>;"
          )

          p.write_text(text)
          PY

          echo "=== Final device definition ==="

          grep -A10 "define Device/tplink_tl-mr3420-v3" target/linux/ath79/image/tiny-tp-link.mk

          echo "=== Final flash partitions ==="

          grep -n -E "partition@20000|partition@7f0000|0x020000|0x7f0000" target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts


      - name: Check 8MB definition
        working-directory: openwrt
        run: |
          echo "=== Searching tplink-8mlzma ==="

          grep -R -n -A10 "define Device/tplink-8mlzma" target/linux/ath79/image

          if ! grep -R -q "define Device/tplink-8mlzma" target/linux/ath79/image; then
            echo "ERROR: tplink-8mlzma was not found"
            exit 1
          fi


      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Create configuration
        working-directory: openwrt
        run: |
          printf '%s\n' 'CONFIG_TARGET_ath79=y' > .config
          printf '%s\n' 'CONFIG_TARGET_ath79_tiny=y' >> .config
          printf '%s\n' 'CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y' >> .config
          printf '%s\n' 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_luci=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_luci-ssl=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_kmod-ath9k=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_wpad-mini=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_kmod-usb2=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y' >> .config

          echo "=== .config ==="

          cat .config


      - name: Run defconfig
        working-directory: openwrt
        run: |
          make defconfig


      - name: Verify target
        working-directory: openwrt
        run: |
          echo "=== Target ==="

          grep "CONFIG_TARGET_ath79" .config

          echo "=== MR3420 ==="

          grep "CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3" .config

          echo "=== Packages ==="

          grep "CONFIG_PACKAGE_luci" .config
          grep "CONFIG_PACKAGE_kmod-ath9k" .config
          grep "CONFIG_PACKAGE_kmod-usb2" .config

          if ! grep -q "^CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y" .config; then
            echo "ERROR: MR3420 v3 target is not selected"
            exit 1
          fi


      - name: Check prerequisites
        working-directory: openwrt
        run: |
          make prereq


      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j4 V=s


      - name: Build firmware
        working-directory: openwrt
        run: |
          echo "=== BUILD START ==="

          make -j$(nproc) V=s


      - name: Show build results
        working-directory: openwrt
        run: |
          echo "=== ALL ATH79 TINY FILES ==="

          find bin/targets/ath79/tiny -type f -maxdepth 2 | sort

          echo "=== MR3420 FILES ==="

          find bin/targets/ath79/tiny -type f -iname "*mr3420*" -print


      - name: Prepare firmware artifact
        working-directory: openwrt
        run: |
          rm -rf firmware
          mkdir -p firmware

          find bin/targets/ath79/tiny -type f -iname "*mr3420*.bin" -exec cp {} firmware/ \;

          echo "=== FIRMWARE ==="

          ls -lh firmware

          COUNT=$(find firmware -type f | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No MR3420 firmware found"
            exit 1
          fi


      - name: Validate firmware size
        working-directory: openwrt
        run: |
          echo "=== Firmware size ==="

          du -h firmware/*

          for FILE in firmware/*; do
            SIZE=$(stat -c%s "$FILE")

            echo "$FILE = $SIZE bytes"

            if [ "$SIZE" -gt 8388608 ]; then
              echo "ERROR: Firmware exceeds 8MB"
              exit 1
            fi
          done


      - name: Firmware information
        working-directory: openwrt
        run: |
          for FILE in firmware/*; do
            echo "========================================"
            echo "$FILE"
            echo "========================================"

            file "$FILE"
            ls -lh "$FILE"
          done


      - name: Generate SHA256
        working-directory: openwrt
        run: |
          sha256sum firmware/* > firmware/SHA256SUMS

          cat firmware/SHA256SUMS


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-tl-mr3420-v3-8mb
          path: openwrt/firmware/
          if-no-files-found: error
          retention-days: 30
