name: Build OpenWrt 22.03.7 WR841HP v3 Minimal + Material + OpenNDS OFF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt 22.03.7
        run: |
          git clone --branch v22.03.7 --single-branch https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git describe --tags --always

      - name: Install package feeds
        run: |
          cd openwrt
          cat > feeds.conf.default <<'EOF'
          src-git-full packages https://git.openwrt.org/feed/packages.git^3b79b05673a15e7f41f157d1320597244a344a95
          src-git-full luci https://git.openwrt.org/project/luci.git^374888b1476df064281022c4d605b7ecf9e684e4
          src-git-full routing https://git.openwrt.org/feed/routing.git^1ff9ee61cde0829f206f275b1b2f5fa990fd2ba9
          src-git-full telephony https://git.openwrt.org/feed/telephony.git^2a69b3a6f0a42c7fa965a72f9a1361cb94a1ce86
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure minimal firmware with native firewall, LuCI Material and OpenNDS
        run: |
          cd openwrt
          rm -f .config
          cat > .config <<'EOF'
          # Target: TP-Link TL-WR841HP v3 (ath79/generic)
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr841hp-v3=y

          # Minimal LuCI with Material theme and Network > Firewall.
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-theme-material=y

          # OpenNDS is installed but kept OFF by first-boot defaults.
          CONFIG_PACKAGE_opennds=y
          CONFIG_PACKAGE_libmicrohttpd-no-ssl=y

          # Use OpenWrt 22.03.7's native firewall stack: firewall4 + nftables.
          # No custom firewall replacement or custom firewall rules are added here.
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y

          # OpenNDS requires dnsmasq nftset support on this release.
          CONFIG_PACKAGE_dnsmasq-full=y
          # CONFIG_PACKAGE_dnsmasq is not set

          # SSH management.
          CONFIG_PACKAGE_dropbear=y
          EOF

          make defconfig

          echo "=== Target selection ==="
          grep '^CONFIG_TARGET_ath79' .config
          grep -q '^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr841hp-v3=y$' .config

          echo "=== Required packages ==="
          grep -E '^(CONFIG_PACKAGE_(luci|luci-app-firewall|luci-theme-material|opennds|libmicrohttpd-no-ssl|firewall4|nftables-json|dnsmasq-full|dropbear)=y)' .config
          grep -q '^CONFIG_PACKAGE_luci=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-firewall=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-material=y$' .config
          grep -q '^CONFIG_PACKAGE_opennds=y$' .config
          grep -q '^CONFIG_PACKAGE_firewall4=y$' .config
          grep -q '^CONFIG_PACKAGE_nftables-json=y$' .config
          grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' .config

      - name: Keep Wi-Fi enabled and OpenNDS disabled by default
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-minimal-defaults <<'EOF'
          # Ensure wireless configuration exists, then enable all radios and APs.
          [ -s /etc/config/wireless ] || /sbin/wifi config
          for radio in $(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-device$/\1/p'); do
            uci -q set "wireless.$radio.disabled=0"
          done
          for iface in $(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-iface$/\1/p'); do
            uci -q set "wireless.$iface.disabled=0"
          done
          uci -q commit wireless
          /sbin/wifi up >/dev/null 2>&1 || true

          # OpenNDS is included but intentionally remains off until manually enabled.
          if [ -f /etc/config/opennds ]; then
            uci -q set opennds.@opennds[0].enabled='0'
            uci -q commit opennds
          fi
          if [ -x /etc/init.d/opennds ]; then
            /etc/init.d/opennds stop >/dev/null 2>&1 || true
            /etc/init.d/opennds disable >/dev/null 2>&1 || true
          fi
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-minimal-defaults

      - name: Download package sources
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify firmware outputs and required packages
        run: |
          cd openwrt
          test -d bin/targets/ath79/generic
          find bin/targets/ath79/generic -maxdepth 1 -type f \( -name '*wr841hp-v3*' -o -name '*manifest' \) -print
          test -n "$(find bin/targets/ath79/generic -maxdepth 1 -type f -name '*wr841hp-v3-squashfs-factory.bin' -print -quit)"
          test -n "$(find bin/targets/ath79/generic -maxdepth 1 -type f -name '*wr841hp-v3-squashfs-sysupgrade.bin' -print -quit)"
          manifest="$(find bin/targets/ath79/generic -maxdepth 1 -type f -name '*wr841hp-v3.manifest' -print -quit)"
          test -n "$manifest"
          grep -q '^opennds ' "$manifest"
          grep -q '^luci-base ' "$manifest"
          grep -q '^luci-app-firewall ' "$manifest"
          grep -q '^luci-theme-material ' "$manifest"
          grep -q '^firewall4 ' "$manifest"
          grep -q '^nftables-json ' "$manifest"
          grep -q '^dnsmasq-full ' "$manifest"
          echo "Verified: OpenNDS, LuCI Material, LuCI firewall page, native firewall4/nftables and dnsmasq-full are in the image."

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-22.03.7-wr841hp-v3-minimal-material-opennds-off
          path: |
            openwrt/bin/targets/ath79/generic/*wr841hp-v3*
            openwrt/bin/targets/ath79/generic/*manifest
          if-no-files-found: error
          retention-days: 14
