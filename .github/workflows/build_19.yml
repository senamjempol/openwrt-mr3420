name: Build OpenWrt 19.07.9 - TP-Link TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc \
            swig \
            time \
            curl \
            patch \
            bc \
            python3 \
            perl \
            tar \
            gzip \
            bzip2 \
            subversion \
            device-tree-compiler

      # ============================================================
      # 2. PYTHON 2.7
      # OpenWrt 19.07 membutuhkan Python 2
      # ============================================================
      - name: Install Python 2.7
        run: |
          cd /tmp

          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/opt/python2 \
            --without-ensurepip

          make -j2

          sudo make install

          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2

          echo "Python version:"
          /opt/python2/bin/python2.7 --version

          echo "Python default:"
          /usr/local/bin/python --version

      # ============================================================
      # 3. CLONE OPENWRT 19.07.9
      # ============================================================
      - name: Clone OpenWrt 19.07.9
        run: |
          git clone \
            --branch v19.07.9 \
            --single-branch \
            https://github.com/openwrt/openwrt.git

      # ============================================================
      # 4. CHECK SOURCE
      # ============================================================
      - name: Check OpenWrt source
        working-directory: openwrt
        run: |
          echo "OpenWrt version:"
          git describe --tags --always

          echo
          echo "Checking ath79 files..."

          find target/linux/ath79 -type f | \
            grep -E 'mr3420|tiny-tp-link|generic-tp-link' || true

          echo
          echo "Checking tplink-8mlzma..."

          grep -R -n "tplink-8mlzma" \
            target/linux/ath79 || true

      # ============================================================
      # 5. UPDATE FEEDS
      # ============================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 6. CREATE DTS
      # ============================================================
      - name: Create TL-MR3420 v3 DTS
        working-directory: openwrt
        run: |

          cat > target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts <<'EOF'
          #include "qca953x.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
              model = "TP-Link TL-MR3420 v3";

              aliases {
                  led-boot = &led_system;
                  led-failsafe = &led_system;
                  led-running = &led_system;
                  led-upgrade = &led_system;
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "tl-mr3420-v3:green:system";
                      gpios = <&gpio 14 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      linux,code = <KEY_RESTART>;
                      gpios = <&gpio 3 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };

                  wps {
                      label = "wps";
                      linux,code = <KEY_WPS_BUTTON>;
                      gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };
              };
          };

          &spi {
              status = "okay";

              flash@0 {
                  compatible = "jedec,spi-nor";
                  reg = <0>;
                  spi-max-frequency = <25000000>;

                  partitions {
                      compatible = "fixed-partitions";

                      #address-cells = <1>;
                      #size-cells = <1>;

                      partition@0 {
                          label = "u-boot";
                          reg = <0x000000 0x020000>;
                          read-only;
                      };

                      partition@20000 {
                          compatible = "tplink,firmware";
                          label = "firmware";
                          reg = <0x020000 0x7d0000>;
                      };

                      partition@7f0000 {
                          label = "art";
                          reg = <0x7f0000 0x010000>;
                          read-only;
                      };
                  };
              };
          };

          &wmac {
              status = "okay";
          };

          &uart {
              status = "okay";
          };
          EOF

      # ============================================================
      # 7. ADD DEVICE DEFINITION
      # ============================================================
      - name: Add TL-MR3420 v3 device definition
        working-directory: openwrt
        run: |

          FILE="target/linux/ath79/image/tiny-tp-link.mk"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE tidak ditemukan!"
            exit 1
          fi

          cat >> "$FILE" <<'EOF'

          define Device/tplink_tl-mr3420-v3-8m
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_TITLE := TP-Link TL-MR3420 v3 8MB
            DEVICE_DTS := qca9531_tplink_tl-mr3420-v3
            TPLINK_HWID := 0x34200003
            IMAGE_SIZE := 8000k
          endef
          TARGET_DEVICES += tplink_tl-mr3420-v3-8m

          EOF

          echo "=========================================="
          echo "MR3420 v3 DEVICE DEFINITION"
          echo "=========================================="

          tail -30 "$FILE"

      # ============================================================
      # 8. CREATE CONFIG
      # ============================================================
      - name: Create OpenWrt configuration
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          # ========================================================
          # TARGET
          # ========================================================

          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3-8m=y


          # ========================================================
          # LUCi
          # ========================================================

          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-openwrt-2020=y

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y


          # ========================================================
          # OPENNDS
          # ========================================================

          CONFIG_PACKAGE_opennds=y


          # ========================================================
          # DNSMASQ FULL
          # ========================================================

          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y


          # ========================================================
          # USB
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y

          CONFIG_PACKAGE_usb-modeswitch=y


          # ========================================================
          # DISABLE IPV6
          # ========================================================

          CONFIG_PACKAGE_odhcp6c=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n
          CONFIG_PACKAGE_luci-proto-ipv6=n

          CONFIG_IPV6=n
          CONFIG_KERNEL_IPV6=n


          # ========================================================
          # BUILD
          # ========================================================

          CONFIG_DEVEL=y

          EOF

      # ============================================================
      # 9. DEFCONFIG
      # ============================================================
      - name: Generate configuration
        working-directory: openwrt
        run: |

          export PATH="/usr/local/bin:/opt/python2/bin:$PATH"

          echo "Python:"
          python --version

          echo
          echo "Python 2:"
          python2 --version

          echo
          echo "Running make defconfig..."

          make defconfig

      # ============================================================
      # 10. SHOW FINAL CONFIG
      # ============================================================
      - name: Show final configuration
        working-directory: openwrt
        run: |

          echo "=========================================="
          echo "TARGET"
          echo "=========================================="

          grep -E \
            'CONFIG_TARGET_ath79|CONFIG_TARGET_.*DEVICE_tplink' \
            .config || true

          echo
          echo "=========================================="
          echo "LUCi / OPENNDS / DNSMASQ"
          echo "=========================================="

          grep -E \
            'CONFIG_PACKAGE_(luci|opennds|dnsmasq)' \
            .config || true

          echo
          echo "=========================================="
          echo "USB"
          echo "=========================================="

          grep -E \
            'CONFIG_PACKAGE_(kmod-usb|usb-modeswitch)' \
            .config || true

          echo
          echo "=========================================="
          echo "IPV6"
          echo "=========================================="

          grep -E \
            'CONFIG_(IPV6|KERNEL_IPV6|PACKAGE_odhcp|PACKAGE_luci-proto-ipv6)' \
            .config || true

      # ============================================================
      # 11. DOWNLOAD
      # ============================================================
      - name: Download sources
        working-directory: openwrt
        run: |

          export PATH="/usr/local/bin:/opt/python2/bin:$PATH"

          make download -j4 V=s

      # ============================================================
      # 12. BUILD
      # ============================================================
      - name: Build OpenWrt
        run: |
          make -j$(nproc)

      - name: Show firmware files
        run: |
          echo "=== Firmware hasil build ==="
          find bin/targets -type f \( \
          -name "*.bin" -o \
          -name "*.itb" -o \
          -name "*.img.gz" \
          \) -printf "%p %k KB\n"

      - name: Prepare firmware
        run: |
          mkdir -p firmware
          find bin/targets -type f \( \
          -name "*.bin" -o \
          -name "*.itb" -o \
          -name "*.img.gz" \
          \) -exec cp {} firmware/ \;

          echo "=== Isi firmware ==="
          ls -lh firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-MR3420-v3
          path: firmware/*
          if-no-files-found: error
          compression-level: 9
