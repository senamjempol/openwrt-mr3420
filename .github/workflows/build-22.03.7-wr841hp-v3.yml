name: Build OpenWrt 22.03.7 WR841HP v3 8MB Minimal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl libffi-dev

      - name: Clone OpenWrt 22.03.7
        run: |
          git clone --branch v22.03.7 --single-branch https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git describe --tags --always

      - name: Update official feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure minimal firmware
        run: |
          cd openwrt
          rm -f .config

          cat > .config <<'EOF'
          # Target: TP-Link TL-WR841HP v3
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr841hp-v3=y

          # Disable IPv6 to save flash/RAM.
          # CONFIG_IPV6 is not set

          # Essential LuCI.
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-lib-base=y
          CONFIG_PACKAGE_luci-lib-ip=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_libiwinfo-lua=y

          # LuCI/RPC web server.
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          # Software / package manager.
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_luci-app-opkg=y

          # Firewall 4 / nftables.
          # This is the native firewall stack in OpenWrt 22.03.
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_luci-app-firewall=y

          # openNDS - included in firmware, disabled by default.
          CONFIG_PACKAGE_opennds=y
          CONFIG_PACKAGE_libmicrohttpd-no-ssl=y

          # Indonesian LuCI.
          CONFIG_LUCI_LANG_id=y
          EOF

          make defconfig

          echo "=== Target ==="
          grep '^CONFIG_TARGET_ath79' .config

          echo "=== Required target check ==="
          grep '^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr841hp-v3=y' .config

          echo "=== Important packages ==="
          grep -E '^(CONFIG_PACKAGE_(luci-theme-material|luci-app-opkg|luci-app-firewall|firewall4|opennds|libmicrohttpd-no-ssl)|# CONFIG_IPV6)' .config

          test "$(grep -c '^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr841hp-v3=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_opennds=y' .config)" -eq 1

      - name: Add first-boot defaults and package feeds
        run: |
          cd openwrt

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-default-settings <<'EOF'
          # Set timezone to Jakarta (WIB, UTC+7).
          uci -q set system.@system[0].timezone='WIB-7'
          uci -q set system.@system[0].zonename='Asia/Jakarta'
          uci -q commit system

          # Set the default root password.
          printf '%s\n%s\n' 'enter' 'enter' | passwd root >/dev/null 2>&1 || true

          # Generate wireless config if it does not exist yet.
          [ -s /etc/config/wireless ] || /sbin/wifi config

          # Default LAN address.
          uci -q set network.lan.proto='static'
          uci -q set network.lan.ipaddr='192.168.100.1'
          uci -q set network.lan.netmask='255.255.255.0'
          uci -q delete network.lan.gateway
          uci -q delete network.lan.dns
          uci -q commit network

          # Enable the radio and configure the default AP.
          for radio in $(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-device$/\1/p'); do
            uci -q set "wireless.$radio.disabled=0"
          done

          if uci -q get wireless.@wifi-iface[0].ssid >/dev/null 2>&1; then
            uci -q set wireless.@wifi-iface[0].ssid='SEGALA TEKNIK'
            uci -q set wireless.@wifi-iface[0].encryption='psk2'
            uci -q set wireless.@wifi-iface[0].key='takonobojoku'
            uci -q set wireless.@wifi-iface[0].network='lan'
            uci -q set wireless.@wifi-iface[0].mode='ap'
            uci -q set wireless.@wifi-iface[0].disabled='0'
          fi

          uci -q commit wireless
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-default-settings

          cat > files/etc/uci-defaults/98-voucher-hotspot <<'EOF'
          # Dedicated voucher bridge for the HOTSPOT AP.
          # Logical interface: voucher
          # Linux bridge device: br-voucher
          uci -q set network.br_voucher='device'
          uci -q set network.br_voucher.name='br-voucher'
          uci -q set network.br_voucher.type='bridge'

          uci -q set network.voucher='interface'
          uci -q set network.voucher.device='br-voucher'
          uci -q set network.voucher.proto='static'
          uci -q set network.voucher.ipaddr='192.168.101.1'
          uci -q set network.voucher.netmask='255.255.255.0'
          uci -q delete network.voucher.gateway
          uci -q delete network.voucher.dns

          # DHCP for voucher clients. Use a named section.
          uci -q set dhcp.voucher='dhcp'
          uci -q set dhcp.voucher.interface='voucher'
          uci -q set dhcp.voucher.start='100'
          uci -q set dhcp.voucher.limit='100'
          uci -q set dhcp.voucher.leasetime='12h'

          # Add the open, passwordless HOTSPOT AP on the existing radio.
          radio=$(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-device$/\1/p' | head -n 1)
          if [ -n "$radio" ]; then
            # Use a named wifi-iface section so LuCI does not show
            # the "Wireless configuration migration" warning.
            uci -q set wireless.voucher_ap='wifi-iface'
            uci -q set wireless.voucher_ap.device="$radio"
            uci -q set wireless.voucher_ap.mode='ap'
            uci -q set wireless.voucher_ap.ssid='HOTSPOT'
            uci -q set wireless.voucher_ap.encryption='none'
            uci -q set wireless.voucher_ap.network='voucher'
            uci -q set wireless.voucher_ap.disabled='0'
          fi

          uci -q commit network
          uci -q commit dhcp
          uci -q commit wireless
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/98-voucher-hotspot

          cat > files/etc/uci-defaults/97-voucher-firewall <<'EOF'
          # Voucher clients may reach the Internet, but cannot access router
          # management services such as LuCI/SSH from the HOTSPOT network.
          zone=$(uci add firewall zone)
          uci -q set "firewall.$zone.name=voucher"
          uci -q set "firewall.$zone.network=voucher"
          uci -q set "firewall.$zone.input=REJECT"
          uci -q set "firewall.$zone.output=ACCEPT"
          uci -q set "firewall.$zone.forward=REJECT"
          uci -q set "firewall.$zone.masq=1"

          forward=$(uci add firewall forwarding)
          uci -q set "firewall.$forward.src=voucher"
          uci -q set "firewall.$forward.dest=wan"

          # Allow DHCP and DNS on the router for voucher clients.
          rule=$(uci add firewall rule)
          uci -q set "firewall.$rule.name=Allow-DHCP-Voucher"
          uci -q set "firewall.$rule.src=voucher"
          uci -q set "firewall.$rule.proto=udp"
          uci -q set "firewall.$rule.dest_port=67"
          uci -q set "firewall.$rule.target=ACCEPT"

          rule=$(uci add firewall rule)
          uci -q set "firewall.$rule.name=Allow-DNS-Voucher"
          uci -q set "firewall.$rule.src=voucher"
          uci -q set "firewall.$rule.proto='tcp udp'"
          uci -q set "firewall.$rule.dest_port=53"
          uci -q set "firewall.$rule.target=ACCEPT"

          uci -q commit firewall
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/97-voucher-firewall

          # Install the three OpenNDS files from the repository root.
          # - opennds   -> /etc/config/opennds
          # - voucher.sh -> /etc/opennds/voucher.sh
          # - vouchers  -> /etc/opennds/vouchers
          # The OpenNDS gateway is bound to the voucher network device br-voucher.
          mkdir -p files/etc/config files/etc/opennds
          cp ../opennds files/etc/config/opennds
          cp ../voucher.sh files/etc/opennds/voucher.sh
          cp ../vouchers files/etc/opennds/vouchers
          chmod 755 files/etc/opennds/voucher.sh

          uci -q set opennds.@opennds[0].gatewayinterface='br-voucher' 2>/dev/null || true

          cat > files/etc/uci-defaults/96-disable-opennds <<'EOF'
          # Keep openNDS installed and fully configured, but disabled by default.
          # The actual OpenNDS configuration and voucher files are copied from
          # the repository root during the build.
          if [ -f /etc/config/opennds ]; then
            uci -q set opennds.@opennds[0].gatewayinterface='br-voucher'
            uci -q commit opennds
          fi

          if [ -x /etc/init.d/opennds ]; then
            /etc/init.d/opennds stop 2>/dev/null || true
            /etc/init.d/opennds disable 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/96-disable-opennds

          mkdir -p files/etc/opkg

          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz openwrt_core https://downloads.openwrt.org/releases/22.03.7/targets/ath79/generic/packages
          src/gz openwrt_base https://downloads.openwrt.org/releases/22.03.7/packages/mips_24kc/base
          src/gz openwrt_luci https://downloads.openwrt.org/releases/22.03.7/packages/mips_24kc/luci
          src/gz openwrt_packages https://downloads.openwrt.org/releases/22.03.7/packages/mips_24kc/packages
          src/gz openwrt_routing https://downloads.openwrt.org/releases/22.03.7/packages/mips_24kc/routing
          src/gz openwrt_telephony https://downloads.openwrt.org/releases/22.03.7/packages/mips_24kc/telephony
          EOF

          echo "=== Package feeds ==="
          grep -n '^src/gz' files/etc/opkg/distfeeds.conf

      - name: Download sources
        run: |
          cd openwrt
          make download -j2

      - name: Build
        run: |
          cd openwrt
          make -j2 V=s

      - name: Verify firmware
        run: |
          cd openwrt

          echo "=== Build output ==="
          ls -lh bin/targets/ath79/generic/

          echo "=== WR841HP v3 images ==="
          ls -lh bin/targets/ath79/generic/*tplink_tl-wr841hp-v3*.bin

          test -f bin/targets/ath79/generic/*tplink_tl-wr841hp-v3-squashfs-factory.bin
          test -f bin/targets/ath79/generic/*tplink_tl-wr841hp-v3-squashfs-sysupgrade.bin

          # 8 MiB SPI-NOR device: factory image must fit the 0x7d0000 firmware area.
          for f in bin/targets/ath79/generic/*tplink_tl-wr841hp-v3*.bin; do
            bytes=$(stat -c '%s' "$f")
            echo "$f: $bytes bytes"
            test "$bytes" -le 8126464
          done

          sha256sum bin/targets/ath79/generic/*tplink_tl-wr841hp-v3*.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-22.03.7-wr841hp-v3-8mb-minimal
          path: |
            openwrt/bin/targets/ath79/generic/*tplink_tl-wr841hp-v3*.bin
            openwrt/bin/targets/ath79/generic/sha256sums
            openwrt/.config
