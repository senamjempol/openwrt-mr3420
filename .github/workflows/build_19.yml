name: Build OpenWrt 19.07.9 - TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      OPENWRT_DIR: openwrt

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ca-certificates \
            python3 \
            python3-distutils

          echo "=== GCC ==="
          gcc --version | head -1

          echo "=== Python 3 ==="
          python3 --version


      # =========================================================
      # 3. BUILD PYTHON 2.7.18
      #    OpenWrt 19.07 membutuhkan command "python"
      # =========================================================
      - name: Install Python 2.7
        run: |
          cd /tmp

          wget -q \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/opt/python2 \
            --enable-unicode=ucs4 \
            --without-ensurepip

          make -j$(nproc)

          sudo make install

          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2

          echo "/opt/python2/bin" >> "$GITHUB_PATH"

          echo "=== Python ==="
          /opt/python2/bin/python2.7 --version
          python --version
          python2 --version


      # =========================================================
      # 4. CLONE OPENWRT 19.07.9
      # =========================================================
      - name: Clone OpenWrt 19.07.9
        run: |
          rm -rf "$OPENWRT_DIR"

          git clone \
            --depth=1 \
            --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git \
            "$OPENWRT_DIR"

          echo "=== OpenWrt ==="
          pwd
          ls -lah "$OPENWRT_DIR"

          test -f "$OPENWRT_DIR/Makefile"


      # =========================================================
      # 5. PATCH TL-MR3420 V3 DTS
      # =========================================================
      - name: Create TL-MR3420 v3 DTS
        run: |
          cat > "$OPENWRT_DIR/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts" <<'EOF'
          /dts-v1/;

          #include "qca9533.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
              model = "TP-Link TL-MR3420 v3";

              aliases {
                  led-boot = &led_system;
                  led-failsafe = &led_system;
                  led-running = &led_system;
                  led-upgrade = &led_system;
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "green:system";
                      gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
                  };

                  usb {
                      label = "green:usb";
                      gpios = <&gpio 4 GPIO_ACTIVE_LOW>;
                  };

                  wps {
                      label = "green:wps";
                      gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      linux,code = <KEY_RESTART>;
                      gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };

                  wps {
                      label = "wps";
                      linux,code = <KEY_WPS_BUTTON>;
                      gpios = <&gpio 2 GPIO_ACTIVE_LOW>;
                      debounce-interval = <60>;
                  };
              };
          };

          &spi {
              status = "okay";

              flash@0 {
                  compatible = "jedec,spi-nor";
                  reg = <0>;
                  spi-max-frequency = <25000000>;

                  partitions {
                      compatible = "fixed-partitions";
                      #address-cells = <1>;
                      #size-cells = <1>;

                      partition@0 {
                          label = "u-boot";
                          reg = <0x000000 0x020000>;
                          read-only;
                      };

                      firmware: partition@20000 {
                          label = "firmware";
                          reg = <0x020000 0x7d0000>;
                      };

                      art: partition@7f0000 {
                          label = "art";
                          reg = <0x7f0000 0x010000>;
                          read-only;
                      };
                  };
              };
          };

          &eth0 {
              status = "okay";
          };

          &eth1 {
              status = "okay";
          };

          &wmac {
              status = "okay";
              mtd-cal-data = <&art 0x1000>;
          };

          &usb {
              status = "okay";
          };

          &uart {
              status = "okay";
          };
          EOF

          echo "=== DTS ==="
          sed -n '1,240p' \
            "$OPENWRT_DIR/target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts"


      # =========================================================
      # 6. ADD DEVICE DEFINITION
      # =========================================================
      - name: Add TL-MR3420 v3 8MB device
        run: |
          FILE="$OPENWRT_DIR/target/linux/ath79/image/tiny-tp-link.mk"

          # Hapus definisi MR3420 v3 jika sebelumnya pernah ditambahkan
          sed -i '/^define Device\/tplink_tl-mr3420-v3$/,/^TARGET_DEVICES += tplink_tl-mr3420-v3$/d' "$FILE"

          cat >> "$FILE" <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-4mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_DTS := qca9531_tplink_tl-mr3420-v3
            TPLINK_FLASHLAYOUT := 8Mlzma
            IMAGE_SIZE := 7936k
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += tl-mr3420-v3
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF

          echo "=== MR3420 DEVICE DEFINITION ==="

          grep -n \
            -A14 \
            -B2 \
            "tplink_tl-mr3420-v3" \
            "$FILE"


      # =========================================================
      # 7. CHECK TARGET FILES
      # =========================================================
      - name: Verify MR3420 files
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo "======================================"
          echo "DIRECTORY"
          echo "======================================"

          pwd

          echo ""
          echo "======================================"
          echo "MAKEFILE"
          echo "======================================"

          test -f Makefile
          ls -lh Makefile

          echo ""
          echo "======================================"
          echo "DTS"
          echo "======================================"

          test -f \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          grep \
            'tplink,tl-mr3420-v3' \
            target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts

          echo ""
          echo "======================================"
          echo "DEVICE"
          echo "======================================"

          grep \
            -n \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk


      # =========================================================
      # 8. FEEDS
      # =========================================================
      - name: Update feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # =========================================================
      # 9. CREATE CONFIG
      # =========================================================
      - name: Create configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_ath9k-firmware=y
          CONFIG_PACKAGE_wpad-basic=y

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y

          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF


      # =========================================================
      # 10. RUN DEFCONFIG
      # =========================================================
      - name: Run defconfig
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          python --version

          make defconfig

          echo ""
          echo "======================================"
          echo "TARGET CONFIG"
          echo "======================================"

          grep "^CONFIG_TARGET" .config

          echo ""
          echo "======================================"
          echo "MR3420 CONFIG"
          echo "======================================"

          grep \
            "tplink_tl-mr3420-v3" \
            .config || true


      # =========================================================
      # 11. PREREQUISITE CHECK
      # =========================================================
      - name: Check OpenWrt prerequisites
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          python --version
          make prereq


      # =========================================================
      # 12. DOWNLOAD
      # =========================================================
      - name: Download package sources
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make download -j$(nproc)


      # =========================================================
      # 13. BUILD
      # =========================================================
      - name: Build OpenWrt
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo "======================================"
          echo "BUILD OPENWRT"
          echo "======================================"

          make -j$(nproc) V=s


      # =========================================================
      # 14. SHOW RESULT
      # =========================================================
      - name: Show build result
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          echo "======================================"
          echo "ALL TARGET FILES"
          echo "======================================"

          find bin/targets -type f -exec ls -lh {} \;

          echo ""
          echo "======================================"
          echo "FIRMWARE FILES"
          echo "======================================"

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec ls -lh {} \;


      # =========================================================
      # 15. COPY FIRMWARE ONLY
      # =========================================================
      - name: Prepare firmware artifact
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          rm -rf ../firmware
          mkdir -p ../firmware

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec cp {} ../firmware/ \;

          echo ""
          echo "======================================"
          echo "ARTIFACT CONTENT"
          echo "======================================"

          ls -lah ../firmware


      # =========================================================
      # 16. SHA256
      # =========================================================
      - name: Generate SHA256
        run: |
          cd firmware

          sha256sum \
            *.bin \
            *.img \
            *.img.gz \
            *.itb \
            2>/dev/null > sha256sums.txt || true

          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat sha256sums.txt


      # =========================================================
      # 17. UPLOAD FIRMWARE ONLY
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-19.07.9-TL-MR3420-v3-8MB
          path: firmware/*
          if-no-files-found: error
          compression-level: 9
