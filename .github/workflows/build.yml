name: Build OpenWrt 21.02 MR3420 v3 (8MB - Generic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt Source (v21.02)
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout openwrt-21.02

      - name: Move MR3420 v3 to Generic and Configure for 8MB
        run: |
          cd openwrt
          TINY_FILE="target/linux/ath79/image/tiny-tp-link.mk"
          GEN_FILE="target/linux/ath79/image/generic-tp-link.mk"
          
          # 1. Hapus definisi mr3420-v3 dari tiny-tp-link.mk agar tidak konflik
          sed -i '/define Device\/tplink_tl-mr3420-v3/,/endef/d' "$TINY_FILE"
          sed -i '/TARGET_DEVICES += tplink_tl-mr3420-v3/d' "$TINY_FILE"
          
          # 2. Tambahkan definisi mr3420-v3 versi 8MB ke generic-tp-link.mk
          echo "" >> "$GEN_FILE"
          echo "define Device/tplink_tl-mr3420-v3" >> "$GEN_FILE"
          echo "  \$(Device/tplink-8mlzma)" >> "$GEN_FILE"
          echo "  SOC := qca9531" >> "$GEN_FILE"
          echo "  DEVICE_MODEL := TL-MR3420" >> "$GEN_FILE"
          echo "  DEVICE_VARIANT := v3" >> "$GEN_FILE"
          echo "  TPLINK_HWID := 0x34200003" >> "$GEN_FILE"
          echo "  IMAGE_SIZE := 7936k" >> "$GEN_FILE"
          echo "  DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport" >> "$GEN_FILE"
          echo "endef" >> "$GEN_FILE"
          echo "TARGET_DEVICES += tplink_tl-mr3420-v3" >> "$GEN_FILE"
          
          echo "Successfully moved and patched MR3420 v3 for 8MB Generic!"

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration (.config)
        run: |
          cd openwrt
          
          # Gunakan subtarget GENERIC agar muat untuk 8MB penuh
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_DEVICE_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y" >> .config
          
          # Sertakan LuCI dan Bahasa Indonesia
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_LUCI_LANG_id=y" >> .config
          
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-21.02-mr3420v3-8mb-generic
          path: |
            openwrt/bin/targets/ath79/generic/*factory*.bin
            openwrt/bin/targets/ath79/generic/*sysupgrade*.bin
