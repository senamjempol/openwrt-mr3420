name: Build OpenWrt 19.07.9 WR841HP v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl libffi-dev

          # OpenWrt 19.07.9 requires the host command "python" to be Python 2.x.
          cd /tmp
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/python2.7 --enable-unicode=ucs4
          make -j2
          sudo make install
          sudo ln -sf /opt/python2.7/bin/python2.7 /usr/local/bin/python
          python --version

      - name: Clone exact OpenWrt 19.07.9 source
        run: |
          git clone --branch v19.07.9 --single-branch https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout v19.07.9
          git describe --tags --always

      - name: Port TL-WR841HP v3 8MB device
        run: |
          cd openwrt

          DTS="target/linux/ath79/dts/qca9533_tplink_tl-wr841hp-v3.dts"
          GENERIC="target/linux/ath79/image/generic-tp-link.mk"
          COMMON="target/linux/ath79/image/common-tp-link.mk"

          mkdir -p "$(dirname "$DTS")"

          cat > "$DTS" <<'DTS_EOF'
          // SPDX-License-Identifier: GPL-2.0-or-later OR MIT

          #include "qca953x.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
            compatible = "tplink,tl-wr841hp-v3", "qca,qca9533";
            model = "TP-Link TL-WR841HP v3";

            aliases {
              label-mac-device = &wmac;
              led-boot = &led_power;
              led-failsafe = &led_power;
              led-running = &led_power;
              led-upgrade = &led_power;
            };

            leds {
              compatible = "gpio-leds";

              wifi {
                label = "green:wifi";
                gpios = <&gpio 15 GPIO_ACTIVE_LOW>;
                linux,default-trigger = "phy0tpt";
              };

              led_power: power {
                label = "green:power";
                gpios = <&gpio 16 GPIO_ACTIVE_LOW>;
                default-state = "on";
              };

              wan_green {
                label = "green:wan";
                gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
              };

              wan_amber {
                label = "amber:wan";
                gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
              };

              lan {
                label = "green:lan";
                gpios = <&gpio 14 GPIO_ACTIVE_LOW>;
              };

              wps {
                label = "green:wps";
                gpios = <&gpio 4 GPIO_ACTIVE_LOW>;
              };

              re {
                label = "green:re";
                gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
              };
            };

            keys {
              compatible = "gpio-keys";

              reset {
                label = "Reset button";
                linux,code = <KEY_RESTART>;
                gpios = <&gpio 1 GPIO_ACTIVE_LOW>;
                debounce-interval = <60>;
              };

              wifi {
                label = "WiFi button";
                linux,code = <KEY_RFKILL>;
                gpios = <&gpio 0 GPIO_ACTIVE_LOW>;
                debounce-interval = <60>;
              };

              wps {
                label = "WPS button";
                linux,code = <KEY_WPS_BUTTON>;
                gpios = <&gpio 2 GPIO_ACTIVE_LOW>;
                debounce-interval = <60>;
              };

              re {
                label = "RE button";
                linux,code = <BTN_0>;
                gpios = <&gpio 17 GPIO_ACTIVE_LOW>;
                debounce-interval = <60>;
              };
            };
          };

          &spi {
            status = "okay";

            flash@0 {
              compatible = "jedec,spi-nor";
              reg = <0>;
              spi-max-frequency = <25000000>;

              partitions {
                compatible = "fixed-partitions";
                #address-cells = <1>;
                #size-cells = <1>;

                uboot: partition@0 {
                  label = "u-boot";
                  reg = <0x000000 0x020000>;
                  read-only;
                };

                partition@20000 {
                  compatible = "tplink,firmware";
                  label = "firmware";
                  reg = <0x020000 0x7d0000>;
                };

                art: partition@7f0000 {
                  label = "art";
                  reg = <0x7f0000 0x010000>;
                  read-only;
                };
              };
            };
          };

          &eth0 {
            status = "okay";
            phy-handle = <&swphy4>;
            nvmem-cells = <&macaddr_uboot_1fc00>;
            nvmem-cell-names = "mac-address";
            mac-address-increment = <1>;
          };

          &eth1 {
            status = "okay";
            nvmem-cells = <&macaddr_uboot_1fc00>;
            nvmem-cell-names = "mac-address";
          };

          &wmac {
            status = "okay";
            mtd-cal-data = <&art 0x1000>;
            nvmem-cells = <&macaddr_uboot_1fc00>;
            nvmem-cell-names = "mac-address";
          };

          &uboot {
            compatible = "nvmem-cells";
            #address-cells = <1>;
            #size-cells = <1>;

            macaddr_uboot_1fc00: macaddr@1fc00 {
              reg = <0x1fc00 0x6>;
            };
          };
          DTS_EOF

          # 8MiB TP-Link LZMA layout used by the WR841HP v3.
          if ! grep -q '^define Device/tplink-8mlzma' "$COMMON"; then
            cat >> "$COMMON" <<'EOF'

          define Device/tplink-8mlzma
            $(Device/tplink)
            TPLINK_FLASHLAYOUT := 8Mlzma
            IMAGE_SIZE := 7936k
          endef
          EOF
          fi

          # WR841HP v3 was added to OpenWrt after 19.07.9, so add its device profile.
          if ! grep -q 'TARGET_DEVICES += tplink_tl-wr841hp-v3' "$GENERIC"; then
            cat >> "$GENERIC" <<'EOF'

          define Device/tplink_tl-wr841hp-v3
            $(Device/tplink-8mlzma)
            SOC := qca9533
            DEVICE_MODEL := TL-WR841HP
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x08411003
          endef
          TARGET_DEVICES += tplink_tl-wr841hp-v3
          EOF
          fi

          grep -n -A8 'define Device/tplink_tl-wr841hp-v3' "$GENERIC"
          grep -n -A5 'define Device/tplink-8mlzma' "$COMMON"
          test -f "$DTS"

      - name: Update official feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure minimal firmware
        run: |
          cd openwrt
          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr841hp-v3=y

          # No IPv6 to save flash/RAM.
          # CONFIG_IPV6 is not set

          # Essential LuCI.
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-lib-base=y
          CONFIG_PACKAGE_luci-lib-ip=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_libiwinfo-lua=y

          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y

          # Software menu / package manager.
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_luci-app-opkg=y

          # Firewall + dependencies needed by future openNDS.
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_libmicrohttpd-no-ssl=y
          
          # Indonesian LuCI.
          CONFIG_LUCI_LANG_id=y
          EOF

          make defconfig

          grep '^CONFIG_TARGET_ath79' .config
          grep '^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr841hp-v3=y' .config
          grep -E '^(CONFIG_PACKAGE_(luci-theme-material|luci-app-opkg|firewall|iptables|iptables-mod-ipopt|libmicrohttpd-no-ssl)|# CONFIG_IPV6)' .config

      - name: Add first-boot WiFi enable and package feeds
        run: |
          cd openwrt

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-enable-wifi <<'EOF'
          #!/bin/sh
          [ -s /etc/config/wireless ] || /sbin/wifi config
          for radio in $(uci -q show wireless | sed -n 's/^wireless\.\([^.=]*\)=wifi-device$/\1/p'); do
            uci -q set "wireless.$radio.disabled=0"
          done
          uci -q commit wireless
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-enable-wifi

          mkdir -p files/etc/opkg

          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz openwrt_core https://downloads.openwrt.org/releases/19.07.9/targets/ath79/generic/packages
          src/gz openwrt_base https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/base
          src/gz openwrt_luci https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/luci
          src/gz openwrt_packages https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/packages
          src/gz openwrt_routing https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/routing
          src/gz openwrt_telephony https://downloads.openwrt.org/releases/19.07.9/packages/mips_24kc/telephony
          EOF

          grep -n '^src/gz' files/etc/opkg/distfeeds.conf

      - name: Download sources
        run: |
          cd openwrt
          make download -j2

      - name: Build
        run: |
          cd openwrt
          make -j2 V=s

      - name: Verify firmware
        run: |
          cd openwrt
          ls -lh bin/targets/ath79/generic/
          ls -lh bin/targets/ath79/generic/*wr841hp-v3*.bin || true
          test -n "$(find bin/targets/ath79/generic -maxdepth 1 -name '*wr841hp-v3*.bin' -print -quit)"
          for f in bin/targets/ath79/generic/*wr841hp-v3*.bin; do
            bytes=$(stat -c '%s' "$f")
            echo "$f: $bytes bytes"
            test "$bytes" -le 8126464
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-wr841hp-v3-8mb-minimal
          path: |
            openwrt/bin/targets/ath79/generic/*wr841hp-v3*.bin
            openwrt/bin/targets/ath79/generic/sha256sums
