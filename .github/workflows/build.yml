name: OpenWrt 21.02 MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt 21.02
        run: |
          git clone --depth 1 --branch openwrt-21.02 https://github.com/openwrt/openwrt.git openwrt

      - name: Patch MR3420 v3
        run: |
          cd openwrt

          TINY=target/linux/ath79/image/tiny-tp-link.mk
          GENERIC=target/linux/ath79/image/generic-tp-link.mk

          echo "Checking original MR3420..."

          grep -n -A10 "define Device/tplink_tl-mr3420-v3" "$TINY"

          echo "Removing MR3420 from tiny..."

          sed -i '/define Device\/tplink_tl-mr3420-v3/,/endef/d' "$TINY"
          sed -i '/TARGET_DEVICES += tplink_tl-mr3420-v3/d' "$TINY"

          echo "Adding MR3420 to generic..."

          cat >> "$GENERIC" <<'EOF'

          define Device/tplink_tl-mr3420-v3
            $(Device/tplink-8mlzma)
            SOC := qca9531
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v3
            TPLINK_HWID := 0x34200003
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
          endef

          TARGET_DEVICES += tplink_tl-mr3420-v3

          EOF

          echo "Checking patched device..."

          grep -n -A12 "define Device/tplink_tl-mr3420-v3" "$GENERIC"

      - name: Configure target
        run: |
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y

          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_id=y
          EOF

          make defconfig

          echo "Final target configuration:"
          grep "^CONFIG_TARGET_ath79" .config

      - name: Verify MR3420 selection
        run: |
          cd openwrt

          echo "Checking MR3420 configuration..."

          if grep -q "^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v3=y" .config; then
            echo "MR3420 v3 selected"
          else
            echo "MR3420 v3 was not selected"
            exit 1
          fi

          echo "Checking device source..."

          if grep -q "TARGET_DEVICES += tplink_tl-mr3420-v3" target/linux/ath79/image/generic-tp-link.mk; then
            echo "MR3420 v3 found in generic image definition"
          else
            echo "MR3420 v3 not found"
            exit 1
          fi

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download sources
        run: |
          cd openwrt
          make download -j2

      - name: Build firmware
        run: |
          cd openwrt
          make -j2 V=s

      - name: Show firmware
        run: |
          cd openwrt

          echo "Firmware files:"
          find bin/targets/ath79/generic -maxdepth 1 -type f -name "*.bin" -printf "%f\n"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-21.02-mr3420-v3-8mb
          path: |
            openwrt/bin/targets/ath79/generic/*.bin
            openwrt/bin/targets/ath79/generic/sha256sums
