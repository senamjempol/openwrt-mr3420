name: Build OpenWrt 19.07.9 - TP-Link TL-MR3420 v3 8MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            swig \
            time \
            ccache

      # ============================================================
      # 2. DOWNLOAD OPENWRT 19.07.9
      # ============================================================
      - name: Clone OpenWrt 19.07.9
        run: |
          git clone --depth=1 --branch v19.07.9 \
            https://github.com/openwrt/openwrt.git openwrt

      # ============================================================
      # 3. BUILD PYTHON 2.7
      # OpenWrt 19.07.9 membutuhkan python 2.x
      # ============================================================
      - name: Install Python 2.7.18
        run: |
          cd /tmp

          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar xf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/usr/local \
            --enable-optimizations=no

          make -j2

          sudo make altinstall

          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python

          python --version

      # ============================================================
      # 4. PATCH DEVICE MR3420 v3
      # ============================================================
      - name: Configure TL-MR3420 v3 8MB device
        working-directory: openwrt
        run: |

          echo "=============================================="
          echo "CHECKING EXISTING MR3420 FILES"
          echo "=============================================="

          echo ""
          echo "DTS:"
          ls -lh target/linux/ath79/dts/ | grep -i mr3420 || true

          echo ""
          echo "IMAGE MK:"
          grep -R -n \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image \
            || true

          # --------------------------------------------------------
          # Pastikan direktori DTS ada
          # --------------------------------------------------------
          mkdir -p target/linux/ath79/dts

          # --------------------------------------------------------
          # Buat DTS MR3420 v3
          # --------------------------------------------------------
          cat > target/linux/ath79/dts/qca9531_tplink_tl-mr3420-v3.dts <<'EOF'
/dts-v1/;

#include "qca9533.dtsi"

/ {
    compatible = "tplink,tl-mr3420-v3", "qca,qca9531";
    model = "TP-Link TL-MR3420 v3";

    aliases {
        led-boot = &led_system;
        led-failsafe = &led_system;
        led-running = &led_system;
        led-upgrade = &led_system;
    };

    leds {
        compatible = "gpio-leds";

        led_system: system {
            label = "green:system";
            gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
        };

        usb {
            label = "green:usb";
            gpios = <&gpio 8 GPIO_ACTIVE_LOW>;
            trigger-sources = <&ehci_port1>;
            linux,default-trigger = "usbport";
        };

        wlan {
            label = "green:wlan";
            gpios = <&gpio 9 GPIO_ACTIVE_LOW>;
            linux,default-trigger = "phy0tpt";
        };
    };

    keys {
        compatible = "gpio-keys";

        reset {
            label = "reset";
            linux,code = <KEY_RESTART>;
            gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
        };

        wps {
            label = "WPS";
            linux,code = <KEY_WPS_BUTTON>;
            gpios = <&gpio 11 GPIO_ACTIVE_LOW>;
        };
    };

    gpio-export {
        compatible = "gpio-export";

        usb-power {
            gpio-export,name = "usb-power";
            gpio-export,output = <1>;
            gpios = <&gpio 7 GPIO_ACTIVE_HIGH>;
        };
    };
};

&spi {
    status = "okay";

    flash@0 {
        compatible = "jedec,spi-nor";
        reg = <0>;
        spi-max-frequency = <25000000>;

        partitions {
            compatible = "fixed-partitions";
            #address-cells = <1>;
            #size-cells = <1>;

            partition@0 {
                label = "u-boot";
                reg = <0x000000 0x020000>;
                read-only;
            };

            partition@20000 {
                label = "firmware";
                reg = <0x020000 0x7d0000>;
            };

            partition@7f0000 {
                label = "art";
                reg = <0x7f0000 0x010000>;
                read-only;
            };
        };
    };
};

&uart {
    status = "okay";
};

&usb {
    status = "okay";
};

&usb_phy {
    status = "okay";
};

&wmac {
    status = "okay";
};

EOF

          # --------------------------------------------------------
          # Tambahkan profile MR3420 v3 jika belum ada
          # --------------------------------------------------------

          if ! grep -q "define Device/tplink_tl-mr3420-v3" \
              target/linux/ath79/image/tiny-tp-link.mk
          then

            cat >> target/linux/ath79/image/tiny-tp-link.mk <<'EOF'

define Device/tplink_tl-mr3420-v3
  $(Device/tplink-8mlzma)
  SOC := qca9531
  DEVICE_VENDOR := TP-Link
  DEVICE_MODEL := TL-MR3420
  DEVICE_VARIANT := v3
  TPLINK_HWID := 0x34200003
  DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
endef

TARGET_DEVICES += tplink_tl-mr3420-v3

EOF

          fi

          # --------------------------------------------------------
          # Pastikan profile benar-benar ada
          # --------------------------------------------------------

          echo ""
          echo "=============================================="
          echo "MR3420 DEVICE DEFINITION"
          echo "=============================================="

          grep -A12 \
            "define Device/tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk

          echo ""
          echo "TARGET DEVICES:"
          grep -n \
            "tplink_tl-mr3420-v3" \
            target/linux/ath79/image/tiny-tp-link.mk

      # ============================================================
      # 5. UPDATE FEEDS
      # ============================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 6. BUAT CONFIG
      # ============================================================
      - name: Create MR3420 configuration
        working-directory: openwrt
        run: |

          rm -f .config

          cat > .config <<'EOF'

          # ==================================================
          # TARGET
          # ==================================================

          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_tiny=y

          CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y

          # ==================================================
          # BASE SYSTEM
          # ==================================================

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          # ==================================================
          # LUCI
          # ==================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # ==================================================
          # WIFI
          # ==================================================

          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_wpad-mini=y

          # ==================================================
          # USB
          # ==================================================

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y

          # ==================================================
          # FILESYSTEM
          # ==================================================

          CONFIG_PACKAGE_kmod-fs-ext4=y

          EOF

          echo ""
          echo "=============================================="
          echo "INITIAL CONFIG"
          echo "=============================================="

          grep -E \
            'CONFIG_TARGET_ath79|CONFIG_TARGET_DEVICE' \
            .config

      # ============================================================
      # 7. DEFCONFIG
      # ============================================================
      - name: Run defconfig
        working-directory: openwrt
        run: |

          make defconfig

          echo ""
          echo "=============================================="
          echo "FINAL TARGET CONFIG"
          echo "=============================================="

          grep -E \
            'CONFIG_TARGET_ath79|CONFIG_TARGET_DEVICE' \
            .config

          echo ""
          echo "=============================================="
          echo "CHECK MR3420 CONFIG"
          echo "=============================================="

          if grep -q \
            '^CONFIG_TARGET_DEVICE_ath79_tiny_DEVICE_tplink_tl-mr3420-v3=y' \
            .config
          then
            echo "MR3420 v3 PROFILE = SELECTED"
          else
            echo "ERROR: MR3420 v3 PROFILE TIDAK TERPILIH!"
            exit 1
          fi

      # ============================================================
      # 8. CHECK TARGET DEVICE LIST
      # ============================================================
      - name: Verify target device
        working-directory: openwrt
        run: |

          echo "=============================================="
          echo "CHECK TARGET DEVICE"
          echo "=============================================="

          make -s target/linux/compile V=s \
            2>&1 | tee /tmp/target-check.log

          echo ""
          echo "MR3420 references:"
          grep -i \
            "mr3420" \
            /tmp/target-check.log \
            || true

      # ============================================================
      # 9. DOWNLOAD SOURCES
      # ============================================================
      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j4 V=s

      # ============================================================
      # 10. BUILD
      # ============================================================
      - name: Build OpenWrt
        working-directory: openwrt
        run: |

          echo "=============================================="
          echo "START BUILD"
          echo "=============================================="

          make -j$(nproc) V=s

      # ============================================================
      # 11. VERIFY OUTPUT
      # ============================================================
      - name: Verify firmware output
        working-directory: openwrt
        run: |

          echo ""
          echo "=============================================="
          echo "TARGET DIRECTORY"
          echo "=============================================="

          find bin/targets \
            -maxdepth 4 \
            -type f \
            -printf '%s %p\n' \
            | sort -nr \
            | head -100 \
            | numfmt --field=1 --to=iec

          echo ""
          echo "=============================================="
          echo "ALL MR3420 FILES"
          echo "=============================================="

          find bin/targets \
            -type f \
            | grep -i \
              -E 'mr3420|3420' \
            || true

          echo ""
          echo "=============================================="
          echo "IMAGE FILES"
          echo "=============================================="

          find bin/targets \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
            \) \
            -exec ls -lh {} \;

          echo ""
          echo "=============================================="
          echo "TARGET SIZE"
          echo "=============================================="

          du -sh bin/targets

      # ============================================================
      # 12. EXTRACT ONLY MR3420
      # ============================================================
      - name: Collect only MR3420 firmware
        working-directory: openwrt
        run: |

          rm -rf firmware
          mkdir -p firmware

          echo "=============================================="
          echo "SEARCH MR3420 FIRMWARE"
          echo "=============================================="

          find bin/targets \
            -type f \
            \( \
              -name "*mr3420*.bin" \
              -o -name "*mr3420*.img" \
              -o -name "*mr3420*.img.gz" \
              -o -name "*mr3420*.itb" \
            \) \
            -print

          # --------------------------------------------------------
          # Copy firmware MR3420 saja
          # --------------------------------------------------------

          find bin/targets \
            -type f \
            \( \
              -name "*mr3420*.bin" \
              -o -name "*mr3420*.img" \
              -o -name "*mr3420*.img.gz" \
              -o -name "*mr3420*.itb" \
            \) \
            -exec cp {} firmware/ \;

          echo ""
          echo "=============================================="
          echo "COLLECTED FILES"
          echo "=============================================="

          ls -lah firmware

          # --------------------------------------------------------
          # HARUS ADA FILE
          # --------------------------------------------------------

          COUNT=$(find firmware -type f | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR:"
            echo "Tidak ada firmware MR3420 v3!"
            echo ""
            echo "Build dihentikan agar tidak menghasilkan"
            echo "artifact ratusan MB / GB."
            exit 1
          fi

          # --------------------------------------------------------
          # Jangan sampai artifact berisi source/build tree
          # --------------------------------------------------------

          TOTAL=$(du -sk firmware | awk '{print $1}')

          echo ""
          echo "Firmware directory size:"
          echo "${TOTAL} KB"

          if [ "$TOTAL" -gt 20000 ]; then
            echo ""
            echo "ERROR: firmware directory terlalu besar!"
            echo "Kemungkinan file yang salah ikut tercopy."
            exit 1
          fi

      # ============================================================
      # 13. SHA256
      # ============================================================
      - name: Generate SHA256
        working-directory: openwrt
        run: |

          cd firmware

          sha256sum * > sha256sums.txt

          echo ""
          cat sha256sums.txt

      # ============================================================
      # 14. FINAL CHECK
      # ============================================================
      - name: Final artifact check
        working-directory: openwrt
        run: |

          echo "=============================================="
          echo "FINAL FIRMWARE"
          echo "=============================================="

          find firmware \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;

          echo ""
          echo "Total:"
          du -sh firmware

      # ============================================================
      # 15. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload MR3420 firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-19.07.9-TL-MR3420-v3-8MB
          path: openwrt/firmware/*
          if-no-files-found: error
          retention-days: 7
